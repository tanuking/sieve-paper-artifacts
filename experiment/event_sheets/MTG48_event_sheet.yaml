  ## Slot B — Agenda-Setting Background / Precipitating Context

  ```yaml
  label: B
  name: Agenda-Setting Background / Precipitating Context
  summary: >
    The budget actions were shaped by several background conditions: the 2021
    Charter amendment that gave the Council a new amendment process; an extensive
    committee review process with hearings, testimony, and working sessions;
    ongoing BPS instability and accountability concerns; and equity concerns about
    historical disinvestment in Black, brown, immigrant, working-class, and
    District 4 communities.
  evidence:
    - >
      "Pursuant of the 2021 Charter amendment, the city council has worked as
      budget season to put forward an amendment draft rather than our typical
      rejection on the second Wednesday in June."
    - >
      "This process has included 30 public hearings on departmental budgets and
      associated capital projects, including two sessions dedicated to public
      participation and has received written testimony from all city departments
      as well as written recorded testimony from the public."
    - >
      "The committee also held four working sessions for council deliberation to
      put forward amendments to the mayor's proposal."
    - >
      "We're working towards creating a an elected school committee. We're
      expecting a new superintendent. And of course, the issues of state
      receivership still looms over our heads."
    - >
      "In the last five years District four has received the least in the capital
      plan by dollar amount in percentage of any neighborhood... while other
      districts have surpassed over $1 billion."
