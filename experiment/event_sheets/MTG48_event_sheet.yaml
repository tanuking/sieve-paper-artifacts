  ## Slot L — Concrete Concern

  ```yaml
  label: L
  name: Concrete Concern
  summary: >
    Councilors raised concrete concerns about BPS performance, safety,
    transportation, special education and English learner services, transparency,
    athletics, mental health supports, capital planning, inequitable neighborhood
    investment, Mass and Cass spillover, ARPA decision-making, and basic quality of
    life services such as pest control and inspections.
  evidence:
    - >
      "Our return on investment is low, with declining enrollment, poor reading
      levels, an increase in violence, and the inability year after year to
      properly service our most vulnerable students who are on IEPs and receive
      ESL services."
    - >
      "We even struggle with the basic operations such as transportation and food
      services."
    - >
      "I've asked questions time and time again... those questions are half
      fancied or ignored entirely. Moving forward, there is a need for
      accountability, transparency and oversight in our Boston public school system."
    - >
      "We have children who do not feel safe in school. We have children who are
      not arriving to school on time and some not arriving at all."
    - >
      "When you walk on main streets and neighborhoods and see the legacy of
      generations of investments vacant lots, unused buildings, broken sidewalks
      and repair schools and playgrounds disproportionately in my district."
    - >
      "I'm not necessarily in agreement... in particular down at Mass and Cass...
      I don't think it's going to get any better... my ass in cash now is leaking
      into every neighborhood around it."
    - >
      "The quality of life issues that were mentioned already in this budget,
      including pest control, including inspectors for licenses related issues,
      whether it's Airbnb, whether it's after hours work, construction..."
