  ## Slot S — Shared Concern Synthesis

  ```yaml
  label: S
  summary: >
    A recurring concern theme across the public comment and council discussion was
    that Long Beach faced an urgent affordable-housing and displacement crisis,
    and that the draft inclusionary housing / no net loss package needed stronger,
    faster, and more durable protections. The recurring problem-side content
    centered on delayed implementation, insufficient very low income production,
    weak or misdirected in-lieu fees, expiring affordability protections, offsite
    replacement units, and tenant displacement risk.
  evidence:
    - >
      Multiple public commenters urged eliminating the three-year phase-in,
      dedicating fees to very low income or net new units, indexing fees,
      eliminating the 2025 no net loss expiration, requiring onsite replacement,
      and making affordability covenants last for the life of the project or in
      perpetuity.
    - >
      Councilwoman Zendejas's motion adopted several of those concern areas as
      amendments or 120-day report-back requests.
    - >
      Councilwoman Allen said the city was in the middle of a housing crisis and
      needed action now, while Vice Mayor Richardson described the recommendations
      as making the policy stronger while keeping development feasible.
  source_vocabulary:
    - stronger inclusionary housing policy
    - make this policy stronger
    - affordable housing crisis
    - displacement
    - very low income units
    - no net loss
    - in lieu fees
    - life of the project
    - in perpetuity
    - three year phase in
    - 2025 expiration date
    - on site replacement
  temporal_status:
    primary: recurring_concern
    secondary:
      - currently_existing
      - hypothetical_or_risk
      - pending_future_handling
    notes:
      - >
        The concern recurred across several public comments and was then reflected
        in Council motion items and support comments.
      - >
        Some problem content described current crisis conditions; other content
        described risks if the policy remained too weak or was delayed.
  source_context_for_fact_check:
    concern_theme: >
      Recurring concern that Long Beach's affordable-housing and displacement
      crisis required stronger, faster, more durable inclusionary housing and no
      net loss protections.
    concern_content:
      - >
        The three-year phase-in was criticized as too slow and likely to reduce
        near-term affordable-unit production.
      - >
        In-lieu fees were criticized unless limited to very low income / net new
        unit production and tied to objective cost indices.
      - >
        The 2025 no net loss expiration was criticized as arbitrary.
      - >
        Affordability covenants were criticized as insufficient if they lasted
        only 55 or 50 years rather than for life of project / perpetuity.
      - >
        Replacement units were criticized unless built on site, or in one public
        comment, within one-half mile only if onsite replacement was impossible.
      - >
        Alternative compliance methods and offsite land dedication were criticized
        as potential loopholes.
    relationship_to_motion:
      - >
        Zendejas's motion addressed several recurring concerns by requesting
        report-backs or amendments on covenants, in-lieu fee use, fee indexing,
        the no net loss sunset, and onsite replacement units.
    not_supported:
      - >
        The source does not support a claim that every public commenter raised
        every concern; the theme is synthesized across multiple speakers.
