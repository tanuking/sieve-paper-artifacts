  ## Slot L — Concrete Concern

  ```yaml
  label: L
  summary: >
    Public commenters and councilmembers stated concrete concerns about the
    affordable-housing crisis, displacement, eviction risk during COVID-19,
    racial inequity in rent burden, loss of existing affordable units, delayed
    implementation from a three-year phase-in, insufficiently targeted in-lieu
    fees, expiring affordability covenants, and offsite replacement units. These
    concerns were stated as problem-side harms, risks, obstacles, or deficiencies
    rather than merely as solution language.
  evidence:
    - >
      Public comment described evictions during COVID-19 as deadly and said Long
      Beach renters are mostly Black and other people of color, with Black women
      most rent-burdened.
    - >
      Public comment cited a need for 11,160 low and very low income units and
      argued that waiting three years for 11% affordability would cause
      frontloading of development and fewer affordable units on the ground.
    - >
      Public comment said the current drafts fell short, fees were not narrow
      enough, the no net loss 2025 expiration should be eliminated, replacement
      units should be on site, and covenants should last for the life of the
      project or in perpetuity.
    - >
      One speaker said local tenant advocates were working with 11 buildings
      issued 60-day notices and warned that units being held during eviction
      moratoriums could be lost.
    - >
      Councilwoman Allen described an acute housing shortage anticipated to get
      worse if the Council did not act.
