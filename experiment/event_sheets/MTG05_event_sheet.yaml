  label: N
  summary: >
    The action package and Zendejas motion carried several operative terms and
    requested follow-up items. The staff package included an inclusionary housing
    ordinance for downtown and Midtown, a citywide no net loss ordinance, and an
    in-lieu-fee resolution tied to the inclusionary ordinance. The Zendejas motion
    requested 120-day staff analyses or recommendations on extending affordability
    covenants beyond 55 years to perpetuity / life of project, dedicating rental
    in-lieu fees to very low income unit production, tying fees to annual
    construction-cost and land-cost indices, and ensuring replacement units are
    on site. It also sought to amend the fee resolution so fees create new
    affordable units rather than rehabilitating or subsidizing existing market-rate
    units, and to eliminate the no net loss January 2025 expiration.
