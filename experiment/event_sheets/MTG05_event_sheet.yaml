  # Event Sheet — MTG05

  ## Segment-level note

  The transcript segment covers Long Beach City Council Item 26 on inclusionary housing, a no net loss ordinance, and an inclusionary-housing in-lieu-fee resolution. The transcript ends immediately after the first roll-call vote, when the City Attorney states that two additional votes are still needed. Therefore, this event sheet treats the first vote on the inclusionary zoning / inclusionary housing ordinance as completed in-session, while treating the no net loss ordinance vote, the fee-resolution vote, later readings, and 120-day staff return items as pending or future handling unless separately stated as part of the motion.

