  ## Segment-level source summary

  The Boston City Council took up Docket 0643, a resolution opposing state receivership for Boston Public Schools. Councilor Mejia introduced the resolution, described prior Education Committee hearing activity on state receivership, and argued that state takeover would harm BPS and undermine local accountability. Several councilors supported the resolution, emphasizing the state/DESE track record, local democratic control, parent and community voice, and the need for city-led school improvement. Some councilors opposed or qualified their support by stressing serious BPS failures and the possible need for targeted intervention or partnership rather than full state receivership. The Council then suspended the rules, held a roll-call vote, and the resolution passed.

