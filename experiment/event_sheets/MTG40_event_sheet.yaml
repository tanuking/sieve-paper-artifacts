  ## B — Agenda-Setting Background / Precipitating Context

  ```yaml
  label: B
  summary: >
    The item came forward after commercial property owners petitioned to create the Five
    Points BID, after an Office of Economic Development-supported feasibility and outreach
    process, and after petition thresholds were reported as met. The proposal also sat against
    the background of prior Five Points/Welton corridor planning and the existing Welton
    Corridor Pedestrian Mall / local maintenance district, which was only a two-block district
    and would be dissolved if the BID moved forward.
  evidence:
    - "The city has been petitioned by ... the commercial property owners to create the Five Points Business Improvement District."
    - "Office of Economic Development provided a grant approved in 2015 for the petitioners to begin a feasibility study."
    - "We had five community meetings, 21 one-on-one meetings for property owners and businesses... and then we also did surveys."
    - "On May six we were able to send in to the city and county clerk the record of petitions that represented 56.68% of the land and 62.3% of the total assessed value."
    - "The Welton Street Maintenance District as it exists today ... is only two blocks."
    - "Once this is voted upon in November, this Welton maintenance district will dissolve and become part of the Business Improvement District."
  source_vocabulary:
