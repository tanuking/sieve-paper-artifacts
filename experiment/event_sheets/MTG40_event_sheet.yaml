  # Event Sheet — MTG40

  Meeting segment focus: Denver City Council consideration of Council Bill 341, the creation ordinance for the Five Points Business Improvement District.

  ## Segment-level source note

  This segment concerns Denver City Council's consideration of Council Bill 341, the ordinance creating the Five Points Business Improvement District. The discussion focused on whether the City should establish a BID for the Welton/Five Points corridor to support economic vitality and commercial appeal through services such as economic development, physical improvements, safety and security, marketing and promotion, and advocacy for the area.

  ## T — Topic/Framing

  ```yaml
  label: T
  summary: >
    The segment substantively framed Council Bill 341 as the creation of the Five Points
    Business Improvement District to improve economic vitality and the commercial appeal
    of properties in the proposed Welton/Five Points corridor. The policy direction was to
    create a district that could provide enhanced services and improvements for the targeted
    commercial area, including economic development, physical improvements, safety/security,
    marketing/promotion, and advocacy.
  evidence:
    - "The city has been petitioned by the commercial property owners to create the Five Points Business Improvement District."
    - "The main purpose of the Five Points Business Improvement District is to improve the economic vitality and overall commercial appeal of property within the district."
    - "The district will provide programming and benefits to business and commercial properties located within the proposed boundaries that will include economic development, physical improvements, safety and advocacy."
    - "The operating plan is all about enhanced maintenance, physical improvements, economic development, safety and security, marketing, promotion, and still advocating for the Five Points area."
