  label: U
  summary: >
    After Council's passage of the creation ordinance, important handling remained pending:
    the BID could not raise revenue through the proposed tax levy until eligible electors voted
    in the November 2016 election, and an updated budget would return in the fall. Longer term,
    the district had an initial ten-year term and would dissolve unless the board later determined
    it had been successful and requested Council renewal by resolution.
  evidence:
    - "The ordinance in front of you today just simply creates the organization called the Business Improvement District."
    - "They will also be bringing that budget back in the fall when they have a newer or a better handle on all the costs..."
    - "They won't have the ability to actually raise revenue through taxes until the November 2016 election..."
    - "There will be a vote of all the eligible electors in this commercial district... whether or not to raise taxes up to ten mills."
    - "The district shall exist in an initial term of ten years... The board will then request the City Council to renew the district by resolution at the conclusion of that initial term."
