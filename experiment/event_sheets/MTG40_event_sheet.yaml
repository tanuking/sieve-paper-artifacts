  ## L — Concrete Concern

  ```yaml
  label: L
  summary: >
    Several speakers raised concrete concerns about the proposed BID: that the additional
    levy would burden commercial property owners, that vacant lots, city-owned buildings,
    and residential-heavy blocks would benefit without sharing the same tax burden, that prior
    Welton/Five Points improvement efforts had not delivered promised improvements, that
    maintenance problems such as lighting and watering already existed, and that some affected
    owners felt insufficiently notified or represented.
  evidence:
    - Catherine Wallace opposed the BID because the corridor had vacant properties, parking lots, and city buildings that would not contribute, and she called the additional levy unacceptable.
    - Wallace said prior Welton Street maintenance efforts produced limited improvements and that current lighting and watering problems remained.
    - Mandela Ziggler said residents would receive the same service as businesses and opposed the BID.
    - Myron Melnick said he was the only commercial building on his block, did not want to be taxed to take care of the rest of the residents, and said he was not given the petition or information until about four weeks earlier.
  source_vocabulary:
