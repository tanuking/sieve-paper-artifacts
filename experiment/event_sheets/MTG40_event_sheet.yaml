  ## N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  summary: >
    The operative payload attached to Council Bill 341 and the BID operating plan included
    the district boundaries, scope of services, revenue mechanism, property categories subject
    to assessment, initial budget, board/term structure, and later election requirement. The
    proposed BID covered an 11-block Welton/Five Points corridor, encompassed 219 properties
    and about 42 acres, would provide enhanced maintenance, physical improvements, economic
    development, safety/security, marketing/promotion, events, business support, and related
    services, and would impose up to a 10-mill levy only on commercial real property if later
    approved through the November 2016 election.
  evidence:
    - "The district will extend 11 blocks along both sides of Welton Avenue from 20th Street to Downing..."
    - "The district will encompass 219 properties."
    - "The site consists of approximately 42 acres and is located entirely within the city and county of Denver."
    - "The district will provide programming and benefits... economic development, physical improvements, safety and advocacy."
    - "The district initial budget is expected to be $162,000..."
    - "The initial revenue will consist of property tax revenue on commercial real property and a transfer of the remaining funds from the Welton Corridor Pedestrian Mall Local Maintenance District."
    - "The district will impose a levy of ten mills and only commercial real property in the district boundaries."
    - "Residential property is not subject to the revenue raising powers of the district unless the property owner changes its use to be commercial."
    - "The district shall exist in an initial term of ten years..."
    - "They won't have the ability to actually raise revenue through taxes until the November 2016 election..."
