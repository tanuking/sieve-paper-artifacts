  ## Source scope note

  The transcript opens with a tail from a prior item: final consideration of Council Bill 172 was postponed to Monday, April 16. That prior-item tail is not treated as the main event for this sheet. The slot entries below focus on the Council Bill 173 public hearing, staff report, public testimony, council questions/comments, and roll-call voting sequence contained in the sampled segment.

  The transcript ends after the presiding officer asks the secretary to close voting and announce the results. The final announced result for Council Bill 173 is not included in the provided transcript text. This sheet therefore does not treat the source as supporting a precise final vote count or an explicit final passage announcement for Council Bill 173.

