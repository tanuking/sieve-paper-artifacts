  source_context_for_fact_check:
    payload_carrier:
      - Resolution 31683 carries the ballot-placement authorization/request.
      - Initiative Measure 124 carries the substantive hotel-worker protection requirements described by the chair.
    payload_content:
      resolution_31683:
        - Authorizes the City Clerk and the Executive Director of the Ethics and Elections Commission to take necessary actions for ballot appearance.
        - Requests the King County Elections Director to place the proposed initiative on the November 8, 2016 election ballot.
        - Provides for voters' pamphlet and publication handling.
      initiative_124:
        - Hotel employers must provide panic buttons to employees who work alone in guest rooms.
        - Hotel employers must record accusations that a guest committed an act of violence against an employee and maintain those records for five years.
        - Guests accused of assault, sexual assault, or sexual harassment may not return to the hotel for three years.
        - Guest rooms must have signs advising that the law protects hotel employees from violent assault and sexual harassment and that employees have panic buttons.
        - Employees reporting an act of violence by a guest must be assigned a different floor or work area and given paid time to contact police and consult a counselor.
        - Employee guest-room cleaning workload is limited to 5000 square feet per 8-hour workday.
        - The initiative provides information on hazardous chemicals and controls chemicals to protect employees from hazardous contact or exposure.
        - Large and growing employers must make monthly health-care-related payments to full-time, low-wage employees under the formula described in the transcript.
        - On hotel ownership change, outgoing ownership must provide employment information on current employees within 15 days.
        - Incoming hotel employers must maintain a preferential hiring list of current employees and hire from it from ownership transfer until six months after the hotel is open under the incoming employer.
        - Retaliation, interference with rights, discharge, discrimination, and citizenship/immigration-status-related communications against rights assertion are prohibited.
        - Employees have a private right of action and, if they prevail, are entitled to costs, reasonable attorney's fees, and expenses.
    numeric_values:
