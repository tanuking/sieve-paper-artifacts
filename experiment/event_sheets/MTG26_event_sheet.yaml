  ## Slot N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  summary: >
    Resolution 31683's operative payload authorized City and elections officials to
    take actions needed to place Initiative 124 on the November 8, 2016 ballot and
    in the voters' pamphlet. The initiative payload described in the segment
    included panic buttons for employees working alone in guest rooms, records and
    guest-return restrictions after violence or harassment accusations, injury and
    chemical-exposure protections, health-care-related payments, ownership-transfer
    worker-retention provisions, anti-retaliation rules, and private enforcement rights.
  evidence:
    - "Authorizing the City Clerk and the Executive Director of the Ethics and Elections Commission to take those actions necessary to enable the proposed initiative to appear on the November eight, 2016 ballot."
    - "Requesting the King County Elections Director to place the proposed initiative on the November eight two, 2016 election ballot."
    - "Hotel employers would be required to provide employees who work alone in a guest room, a panic button."
    - "Hotel employers must record accusations that a guest has committed an act of violence against an employee and maintain records for five years."
    - "Guest accused of an assault or sexual assault or sexual harassment may not return to the hotel for three years."
    - "Limiting an employee to 5000 square feet of guest room cleanings per 8 hours per workday."
    - "Large and growing employers must pay full time, low wage employees by the 15th of each month ... either $200, or the difference between the monthly premium ... and 7.5% of the amount in employees wages that exceeds 100% of the federal poverty level."
    - "When a hotel ownership changes, the outgoing employee shall, within 15 days, provide the new owner with employment information on current employees."
    - "The incoming hotel employer will ... maintain a preference of hiring lists of current employees and hire from that list from the date of ownership transfer six months after the hotel is open under the incoming employer."
    - "Retaliation ... is clearly prohibited."
    - "Employees have a private right of action to enforce these rights."
