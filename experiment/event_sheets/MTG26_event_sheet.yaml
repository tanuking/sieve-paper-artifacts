  # Event Sheet — MTG26

  ## Segment-level source note

  The sampled segment covers Seattle City Council handling of Initiative Measure 124, a voter-proposed initiative concerning health, labor, and safety standards for Seattle hotel employees. The Council first filed Clerk File 314352, the City Clerk's report on the certificate of sufficiency, then adopted Resolution 31683 to place Initiative 124 on the November 8, 2016 ballot. The Council did not directly enact Initiative 124 into law during this segment.

