  ## Slot B — Agenda-Setting Background / Precipitating Context

  ```yaml
  label: B
  summary: >
    The agenda item was shaped by Initiative 124 having received sufficient valid
    signatures, triggering the City Clerk's report and the Council's limited set of
    options. The Council also faced an August 2 submission deadline for the
    November 8, 2016 ballot, and several members described worker organizing and
    prior lack of hotel-employer protections as the background for the initiative.
  evidence:
    - "On July 8th, the King County Elections Department notified our clerk that the initiative Measure 1 to 4 had sufficient valid signatures."
    - "From that point, the clerk had 20 days ... to transmit the initiative together with her report to the council at a regular meeting."
    - "After the introduction of the initial initiative, the Council has 45 days to decide whether to do one of the following."
    - "Any measure for the November 8th, 2016 ballot ... must be submitted to the King County elections by August 2nd."
    - "It's precisely because employers don't have policies to protect their workers that workers themselves have had come together to propose a law."
    - "They wrote the legislation. They gathered tens of thousands of signatures to put it on the ballot."
