      - Edwards stated that six BCB-licensed entities, half equity applicants, were denied by the ZBA.
      - Flaherty described inconsistent buffer-zone approvals and denials as creating unpredictability, unfairness, and potential legal exposure.
      - Bok described neighborhood subdistrict concerns about operational details such as trash storage and deliveries.
      - Arroyo cautioned that the whole process should be reviewed, not only the ZBA, because similar issues could arise from BCB approvals.
