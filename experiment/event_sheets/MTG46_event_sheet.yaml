    - Boston Cannabis Board
    - ZBA denials
    - equity applicants
  temporal_status:
    primary: already_occurred
    notes:
      - The background includes prior legalization, prior administrative delays, creation of the BCB, and earlier ZBA/BCB conflicts.
      - Some background conditions, such as buffer enforcement and applicant uncertainty, continued to exist during the segment.
  source_context_for_fact_check:
    trigger_condition:
      - Boston legalized cannabis as part of a statewide initiative in 2016.
      - The state framework included equity-oriented obligations tied to repairing harms from the war on drugs.
      - Boston had a cannabis establishment quota described as tied to 20% of liquor licenses.
      - Boston created a half-mile buffer to avoid concentration and encourage geographic diversity.
      - The Boston Cannabis Board was created after the half-mile buffer and became the cannabis-specific public licensing body.
      - Speakers described ZBA involvement as creating inconsistent, opaque, or inequitable outcomes after BCB approval.
    agenda_connection:
      - These prior conditions were invoked to justify a hearing on cannabis siting regulation and possible separation of ZBA and BCB roles.
