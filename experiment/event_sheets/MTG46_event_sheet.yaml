  ## Slot T — Topic / Framing

  ```yaml
  label: T
  summary: >
    The segment framed the issue as reforming Boston's cannabis establishment regulation and siting process, especially the interaction between the Boston Cannabis Board, the Zoning Board of Appeals, and the half-mile buffer rule. The main policy direction discussed was to review, separate, reduce, or remove the ZBA's role while making the approval process more equitable, predictable, and location-aware.
  evidence:
    - "Councilor Edwards offered the following order for a hearing to discuss the regulation and siting of cannabis establishments in the city of Boston ... and the Zoning Board of Appeals."
    - "Last year, I introduced the zoning amendment ... to remove the ZBA."
    - "I'm just asking that you separate the two."
    - "For me, it's about predictability of process. It's about fairness and it's about upholding the half mile buffer zone."
    - "I would like us to really look at the entire process ... how it could be more equitable versus just looking into the CBA."
  source_vocabulary:
    - regulation and siting of cannabis establishments
    - Zoning Board of Appeals / ZBA
    - Boston Cannabis Board / BCB
    - half-mile buffer zone
    - host community agreements / HCA
    - equity applicants
    - predictability of process
    - fairness
    - remove the ZBA
    - separate the two
  temporal_status:
    primary: currently_existing
    notes:
      - The hearing order concerned an existing Boston cannabis siting and approval process.
      - Proposed reforms, including separating or removing ZBA involvement, remained subjects for future hearing and discussion.
  source_context_for_fact_check:
    subject: Boston cannabis establishment regulation and siting.
    policy_direction:
      - Review and potentially reform the approval/siting process.
      - Discuss separating or removing the ZBA from cannabis approval decisions.
      - Consider empowering or relying more on the Boston Cannabis Board for cannabis-specific decisions.
      - Preserve or clarify location review and the half-mile buffer rather than simply eliminating siting review.
    target:
      - Cannabis establishments in Boston.
      - The cannabis licensing/siting approval path involving the Boston Cannabis Board and the ZBA.
      - The half-mile buffer and location-related review.
    not_supported:
      - The segment does not show final enactment of a zoning amendment.
      - The segment does not show the Council abolishing the ZBA or eliminating the half-mile buffer.
  answer_locality:
