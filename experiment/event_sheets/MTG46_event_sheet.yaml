  ## Slot L — Concrete Concern

  ```yaml
  label: L
  summary: >
    Speakers raised concrete concerns that the cannabis siting process was opaque, inconsistent, costly, inequitable, and unpredictable; that ZBA decisions had disadvantaged equity applicants; that inconsistent buffer decisions could expose the city to legal action; and that neighborhood business districts still needed granular operational review for issues like deliveries and trash.
  evidence:
    - "The ZBA then chose the corporate cannabis shop..."
    - "They enforce it against him. They could have easily switch the order and favored the local veteran. They chose not to."
    - "There are six ... entities that have been given a license by the BCB ... and they were told no by the ZBA."
    - "If I didn't have to go to the ZBA, I would have saved $40,000. I wasted time and money."
    - "Exposing the city to potential legal action and causing additional lack of predictability and fairness..."
    - "Where are you storing your trash and what are you doing with deliveries..."
    - "I would like us to really look at the entire process... how it could be more equitable versus just looking into the CBA."
