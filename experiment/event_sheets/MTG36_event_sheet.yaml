  ## Slot N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  name: Outcome-Near Condition / Operative Payload

  summary: >
    The package carried multiple operative terms: a roughly $23 million repair fund using diverted
    Carnival-related revenues and reserves; a bond issue expected to provide about $17.2 million in
    construction proceeds; Tidelands revenues pledged as bond backing with passenger fees and base rent
    expected as the repayment source; Urban Commons passenger-fee contributions in later years; Carnival
    Dome/passenger-terminal arrangements; and hotel card-check neutrality language.

  evidence:
    - "The city and Urban Commons have each agreed to divert future and current revenues from Carnival to create a fund of approximately $23 million."
    - "There are no new funds being used to accomplish the ship repairs."
    - "The city intends to issue bonds for 17.2 million to be repaid by these revenues..."
    - "The bond issue is expected to be sized at $19 million to provide about 17.2 million in ... construction proceeds..."
    - "The bond issue would be backed by a pledge of tidelands revenue."
    - "The actual source of the debt payment is anticipated to be passenger fees and base rent from Urban Commons."
    - "Urban Commons is pledging year six through ten ... about ... $815,000 a year."
    - "They will be required to construct a passenger terminal facility for Carnival."
    - "If Urban Commons constructs a hotel ... they will require the hotel operator or management company to participate in a card check neutrality agreement within three months..."

  source_vocabulary:
    - $23 million
    - $17.2 million
    - $19 million bond issue
    - construction proceeds
    - passenger fees
    - base rent
    - Tidelands revenue
    - Queen Mary reserves
    - historic preservation fund
    - replacement passenger facility
    - Dome
    - card check neutrality agreement
    - site plan review
    - years one through seven
    - years five through ten
    - approximately $815,000 a year
    - $5.375 million
    - $15 million

  temporal_status:
    primary: future_effect
    secondary:
      - completed_in_session
      - pending_future_handling
      - hypothetical_or_risk
    notes:
      - The Council action was completed in-session, but the payload terms governed future financing, repairs, construction, revenue allocation, and hotel labor-neutrality obligations.
      - The Tidelands pledge was discussed as a risk/backstop if anticipated revenue streams were insufficient.
      - The card-check term applies only if Urban Commons constructs a new hotel on the property.

  source_context_for_fact_check:
    payload_carrier:
      - new amended and restated Queen Mary lease terms with Urban Commons
      - Item 18 Council action
      - repair financing and revenue-sharing package tied to the lease
    payload_content:
      - City and Urban Commons would divert future and current Carnival-related revenues to create an approximately $23 million repair fund.
      - Staff stated no new funds were being used to accomplish the ship repairs.
      - The city intended to issue bonds for $17.2 million in proceeds, with the bond issue sized around $19 million.
      - The bond issue would be backed by a pledge of Tidelands revenue.
      - Staff anticipated passenger fees and base rent from Urban Commons as the actual debt-payment source.
      - Urban Commons would contribute its share of passenger fees in later years.
      - The Dome was to be turned over to Carnival for expanded cruise operations, and Urban Commons would need to construct a replacement passenger terminal facility if it wanted to use the Dome for events.
      - Revenue-sharing provisions would be amended to increase passenger fees paid to Urban Commons to help defray replacement terminal costs.
      - If Urban Commons constructs a new hotel, the hotel operator or management company must participate in a card-check neutrality agreement within three months of site plan review.
    payload_scope:
      - Queen Mary ship repairs and renovation
      - Carnival cruise/passenger facility operations
      - Urban Commons lease and development obligations
      - hotel operator or management company only if a new hotel is constructed
    numeric_values:
      - value: approximately $23 million
        meaning: repair fund created from city and Urban Commons diverted revenues/reserves
      - value: $17.2 million
        meaning: intended bond-funded construction proceeds / bonds to be repaid by revenues
      - value: $19 million
        meaning: expected bond issue size
      - value: over first seven years / years 1-7
        meaning: city revenue pledge period discussed for repayment, with lower amount in years 6-7
      - value: years 5-10 or years 6-10
        meaning: transcript contains both staff references around Urban Commons passenger-fee contribution timing; later clarification states Urban Commons money starts in year 5 under the current agreement and is put in from years 5 to 10, while one clarification also says "year six through ten"
      - value: approximately $815,000 per year
        meaning: estimated Urban Commons later-year passenger-fee contribution
      - value: approximately $5.375 million
        meaning: estimated reduction in city revenue in first ten years due to amended passenger-fee sharing
      - value: $15 million
        meaning: Urban Commons funds for visible/revenue-generating ship areas as described by city staff
      - value: three months
        meaning: card-check neutrality timing after receipt of site plan review if a new hotel is constructed
    not_supported:
      - A claim that the city was using unrelated new General Fund money for the ship repairs is not supported by the staff presentation.
      - A claim that Tidelands revenues were not pledged at all is not supported; they were described as the bond pledge/backstop.
      - A claim that the card-check agreement applied unconditionally to all Urban Commons operations is not supported; it was tied to construction of a new hotel and the hotel operator/management company.

  answer_locality:
