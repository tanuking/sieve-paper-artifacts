  # Event Sheet — MTG36

  segment_item: Item 18 — Queen Mary property / Urban Commons lease terms and financing

  ## Segment-level source note

  This segment concerns Long Beach City Council Item 18. Staff presented revised terms for the Queen Mary lease arrangement with Urban Commons, including urgent ship repair funding, Carnival passenger-terminal arrangements, revenue-sharing changes, and card-check neutrality language. Council members discussed financial risk, Tidelands-backed bond structure, the City Auditor's request for more review time, and whether delay would endanger the deal. The item concluded with the motion carrying.

