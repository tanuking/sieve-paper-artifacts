  # Event Sheet — MTG09

  Segment-level note: This sampled segment is an Alameda City Council interview/discussion segment for executive recruitment firms that could assist with the search for a new city manager. The segment contains presentations and Council questions for Avery Associates / Paul Chmura and Bob Murray & Associates / Bob Murray. It does not record a final Council selection of a recruitment firm or a vote on the search contract within the sampled transcript.

