  ## B — Agenda-Setting Background / Precipitating Context

  label: B

  summary: The rezoning came forward because the site remained under former Chapter 59 zoning even after Denver adopted the Denver Zoning Code in 2010, and the existing retail center was described as outdated and ready for mixed-use redevelopment.

  evidence:
  - "The justifying circumstance of this rezoning is that the city adopted the Denver zoning code in 2010, but the property remained in former Chapter 59"
  - "Marina Square is on the south edge of Denver. It was developed in 1979 ... Now ... it’s past its sell by date and we’re looking for a new energy for that part of the Denver Tech Center"
  - "it is one story. There is no density surrounded by parking. It's very car oriented"

  source_vocabulary:
  - former Chapter 59
  - Denver zoning code in 2010
  - justifying circumstance
  - developed in 1979
  - past its sell-by date
  - new energy
  - one story
  - surrounded by parking
  - car oriented

  temporal_status:
    primary: already_occurred
    notes:
