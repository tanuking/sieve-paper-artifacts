  # Event Sheet — MTG03: Council Bill 22-0125 Rezoning at 8101 and 8351 East Belleview Avenue

  ## Source Segment

  Denver City Council public hearing and final passage discussion for Council Bill 22-0125, concerning an official map amendment / rezoning application for 8101 and 8351 East Belleview Avenue in Council District 4, in the Hampden South / Denver Tech Center area.

  ## T — Topic / Framing

  label: T

  summary: The segment concerned a rezoning application for 8101 and 8351 East Belleview Avenue from former Chapter 59 B-8 zoning with adult-use and billboard overlays to S-MX-8, allowing mixed-use redevelopment with a wider range of building forms and up to eight stories / 110 feet.

  evidence:
  - "presenting an official map and application at 8101 and 8351 East Bellevue Avenue ... requested to ... zone to S-MX-8"
  - "the proposal here is to rezone to allow for a variety of building forms at a maximum building height of eight storeys or 110 feet"
  - "both of these sites are currently mapped with the use overlays. However, these are not wanting to be retained by the applicant"
  - "This request is in Council District four ... in the Hampden South neighborhood"

  source_vocabulary:
  - official map amendment
  - rezoning application
  - S-MX-8
  - variety of building forms
  - maximum height of eight stories or 110 feet
  - adult use overlay
  - billboard use overlay
  - mixed use redevelopment

  temporal_status:
    primary: future_effect
    notes:
      - The rezoning would authorize future redevelopment capacity and standards.
      - The Council action on the bill was completed in this segment, but the land-use effects concern future development.

