  ## U — Unresolved Tail / Future Return Path

  label: U

  summary: Although Council passed the rezoning, affordable-housing implementation remained subject to future execution: the developer still had to identify and secure an off-site property if choosing that path, obtain tax credits or bond financing, meet timing requirements, or revert to the on-site integrated option if delivery failed.

  evidence:
  - "We have some options. We have not kind of gone forward with them pending..."
  - "They have to show evidence that they own a parcel that is sufficient to meet the needs and record a covenant against it before they're able to pull permit"
  - "if within three years [they] are unsuccessful, one, they have to integrate back to the onsite integrated option"
  - "it is bond allocation, it's tax credits, and it's also securing the right piece of ground to do it on with the right approvals. So there's a bunch of moving parts"
  - "I feel like what we have is a backstop"

  source_vocabulary:
  - pending
  - evidence that they own a parcel
  - record a covenant
  - before pull permit
  - within three years
  - unsuccessful
  - integrate back
  - bond allocation
  - tax credits
  - right piece of ground
  - approvals
  - backstop

  temporal_status:
    primary: pending_future_handling
    notes:
