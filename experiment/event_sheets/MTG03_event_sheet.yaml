  ## N — Outcome-Near Condition / Operative Payload

  label: N

  summary: The rezoning and associated agreement would allow S-MX-8 mixed-use development with up to eight stories / 110 feet, while the affordable-housing agreement provided three compliance options, including on-site affordability or a larger off-site affordable-housing project within specified Denver neighborhoods, with fallback obligations if the off-site path failed.

  evidence:
  - "The proposed zoning again would allow for a maximum height of eight storeys or 110 feet, would allow a variety of building forms and also introduces build-to and transparency requirements"
  - "There is also a proposed affordable housing agreement ... contemplates three options for the developer to choose from"
  - "Options B and C would result in more units ... for affordability"
  - "for the off site satisfaction, the location has to be within either Hampden South or Southmoor Park neighborhoods"
  - "if they are unsuccessful ... within three years ... then it reverts back to onsite integrated option one"
  - "construct and market all of the income restricted units within three years of the issuance of the first certificate of occupancy for a residential building on this property"

  source_vocabulary:
  - maximum height
  - eight stories or 110 feet
  - build-to and transparency requirements
  - affordable housing agreement
  - three options
  - on-site integrated option
  - off-site satisfaction
  - Hampden South or Southmoor Park
  - three years
  - certificate of occupancy
  - income restricted units

  temporal_status:
    primary: future_effect
    notes:
      - The zoning standards and affordable-housing obligations would apply to future development.
      - The fallback mechanism would apply if the off-site affordable-housing path was not timely delivered.

