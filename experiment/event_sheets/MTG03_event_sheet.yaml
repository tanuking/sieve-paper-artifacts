  ## L — Concrete Concern

  label: L

  summary: Councilmembers raised concrete concerns about whether the affordable-housing agreement could be satisfied largely through public subsidy rather than a direct developer contribution, and whether affordable units might lag behind or fail to materialize after the market-rate development proceeded.

  evidence:
  - "That's problematic for me ... this is about the development participating"
  - "It concerns me that we didn't negotiate that level of protection from the entire project being publicly subsidized"
  - "if it gets all leased up and it gets built before the affordable is done ... I’m wanting to make sure we have some clear understanding of when this affordability of housing comes online"
  - "so that it's not something that never happens"

  source_vocabulary:
  - problematic
  - development participating
  - publicly subsidized
  - clear understanding
  - when this affordability comes online
  - never happens

  temporal_status:
    primary: hypothetical_or_risk
    notes:
      - The concerns were about possible future implementation and financing outcomes.

  source_context_for_fact_check:
    obstacle_content:
      - Concern that options B or C might rely on public subsidies without enough direct developer contribution.
      - Concern that affordable units could be delayed relative to market-rate development.
      - Concern that the agreement did not directly require free land or a cash contribution from the developer for the off-site affordable project.
    local_anchor:
      - The concern was tied to the Council Bill 22-0125 redevelopment and affordable-housing agreement.
    temporal_status:
      - hypothetical_or_risk

  answer_locality:
    primary_location: Councilmember questions to HOST and the developer.
    supporting_locations:
      - Councilmember Ortega’s timing questions.
      - Later council comments about monitoring the agreement.

