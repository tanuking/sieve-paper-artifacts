  ## S — Shared Concern Synthesis

  label: S

  summary: A recurring concern theme was the scarcity and delivery risk of affordable housing in this part of Denver: councilmembers and HOST emphasized that the area had very little restricted affordable housing, while also questioning how to ensure the agreement produced real additional units.

  evidence:
  - "that's an area where we don't have hardly any affordable housing to speak of"
  - "there's a dearth of truly restricted affordable housing"
  - "The city of Denver gets something like maybe 3 to 5 tax credit allocations a year period ... I'm not actually getting more units"
  - "I'm constantly asking ... why do we get all of the affordable housing in D11 ... and we don't see it around the city"
  - "we need to keep close eyes on this and make sure we get everything that has been proposed"

  source_vocabulary:
  - hardly any affordable housing
  - dearth of truly restricted affordable housing
  - tax credit allocations
  - not actually getting more units
  - keep close eyes on this
  - get everything that has been proposed

