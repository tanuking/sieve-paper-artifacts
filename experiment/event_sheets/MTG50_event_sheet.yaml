  ## Slot B — Agenda-Setting Background / Precipitating Context

  **label:** `B`

  **summary:**
  The current item was shaped by earlier Alameda governance controversies, the mayor’s December 18, 2018 creation of a subcommittee, the Alameda grand jury’s later findings about Charter violations and lack of enforcement mechanisms, and the Council’s July 16, 2019 commitment to investigate reforms. The Jenkins report and examples from Oakland and Santa Monica also informed the proposed language. The COVID-19 shelter-in-place context shaped public comments about the timing of considering Charter changes.

  **evidence:**

  - The mayor said she appointed the subcommittee on December 18, 2018, after speaking about shaken public trust and the need to restore trust and improve city government.
  - The mayor said the Alameda grand jury released a report six months later and that one finding was that the Charter failed to provide enforcement mechanisms for violations.
  - The cited grand jury recommendation said the City Council should investigate amendments to clarify and strengthen governance provisions and outline an enforcement process.
  - Vice Mayor Knox White referred to the Jenkins report, the grand jury, and charter changes in Oakland and Santa Monica as sources for clearer language.
  - Public commenters objected to considering significant Charter changes during shelter-in-place orders and argued the public could not participate normally.

