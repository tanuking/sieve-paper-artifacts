  ## Slot L — Concrete Concern

  **label:** `L`

  **summary:**
  The segment contains several concrete concerns: the current Charter language may be too broad and unclear; the Charter lacks a clear enforcement mechanism; emergency-period meetings may reduce public participation and transparency; removal mechanisms risk undermining due process and voters’ rights; and special elections could create costs or politically motivated removals. These concerns were tied to Alameda’s city governance and to the COVID-19 shelter-in-place context.

  **evidence:**

  - The mayor and grand jury background identified uncertainty caused by a lack of enforcement mechanisms for Charter violations.
  - Knox White said the current “influence” wording was broad enough to chill ordinary communication with the city manager.
  - Public commenters objected that Charter changes during shelter-in-place orders were not urgent, could burden staff, and could limit public input.
  - Councilmember Vella acknowledged the digital divide, reduced word-of-mouth participation, and the importance of due process before removing an elected official.
  - Councilmember Oddie warned against removal based on accusation and discussed protecting both officeholder rights and the rights of constituents who voted for them.
  - The mayor raised the cost of a special election and concern about selective enforcement.

