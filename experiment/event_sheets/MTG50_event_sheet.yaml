  ## Slot U — Unresolved Tail / Future Return Path

  **label:** `U`

  **summary:**
  The final Charter-amendment pathway remained unfinished. The Section 7-3 proposal was to return in June for a timing discussion alongside other possible Charter items; staff could begin preparing draft ballot language, and formal ballot language could return later, potentially in July if the Council pursued the November ballot. No final ballot placement, final ballot text approval, voter approval, or Charter amendment enactment occurred in this segment.

  **evidence:**

  - The city attorney said ballot language would be brought back once the Council directed which measures would go forward and at which election.
  - The city attorney said that if the Council pursued the November election, approval would need to occur by the second July meeting.
  - Councilmembers discussed whether the item should return in June for a timing decision rather than rehashing the substance.
  - The final motion directed a return in the second June meeting relative to timing, with staff able to prepare draft ballot language.

