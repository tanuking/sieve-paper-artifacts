  ## Segment-level source note

  The segment centers on an Alameda City Council discussion of a possible Charter
  amendment to Section 7-3 on council interference. Speakers debate how to define
  improper influence over staff, how to align the Charter with grand jury concerns
  about enforceability and public trust, and whether to add or clarify a removal or
  enforcement path. The in-session action is direction on a potential amendment, not
  final ballot placement or completed Charter adoption.

  ## Slot T — Topic/Framing

  **label:** `T`

  **summary:**
  The segment substantively frames a proposed Alameda City Charter amendment concerning Charter Section 7-3, Council interference, and city governance. The policy move pursued was to clarify and strengthen the Charter's rules about what councilmember conduct counts as improper interference or influence, and to clarify the enforcement/removal process. The target was the rule set governing councilmembers, the mayor, the city manager, and city staff in areas such as hiring, appointments, discipline, removal, purchasing, and contracting.

  **evidence:**

  - The agenda item was introduced as a recommendation to provide direction on potential measures amending the City Charter relating to Charter Section 7-3 and Council interference.
  - The mayor framed the item as bringing the City Charter in line with current needs, restoring public trust, and making city government more effective.
  - The mayor cited the grand jury finding that the Charter lacked enforcement mechanisms when councilmembers and staff violate Charter provisions, and cited the recommendation to clarify and strengthen city governance provisions.
  - Vice Mayor Knox White described the current word “influence” as so broad that it could imply councilmembers should avoid speaking with the city manager about topics related to purchasing or hiring.
  - Councilmember Desai framed his proposal around a city-managed procedure for enforcing Section 7-3 and removing councilmembers who violate the first paragraph.

