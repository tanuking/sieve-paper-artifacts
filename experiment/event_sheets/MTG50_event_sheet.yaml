  ## Slot N — Outcome-Near Condition / Operative Payload

  **label:** `N`

  **summary:**
  The operative payload attached to the carried direction was that staff would work from the revised Section 7-3 language discussed in the meeting: clarify improper Council interference, add explicit reference to the mayor where appropriate, revise the final sentence so violations are prosecuted as prescribed by state law and conviction causes forfeiture of office, and bring the matter back in June for timing consideration while staff could begin drafting ballot language. Desai’s alternative payload — a multi-step DA/grand-jury/special-election removal process — was discussed but not adopted as the carried direction.

  **evidence:**

  - Knox White proposed clarifying the final sentence so a violation by a Council member would be prosecuted as prescribed by state law, with conviction leading to forfeiture of office.
  - Councilmembers discussed adding the mayor explicitly to the Charter language.
  - Councilmember Vella supported the Knox White proposal and also raised updating gendered language.
  - The city attorney said staff would bring ballot language when directed and suggested that formal ballot language would follow a final Council decision on what measures move forward.
  - The final motion allowed staff to prepare ballot language and return the proposal in June for the timing discussion.

