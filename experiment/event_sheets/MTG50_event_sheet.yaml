  ## Slot O — Outcome/Position

  **label:** `O`

  **summary:**
  The Alameda City Council voted to move forward procedurally with a revised Knox White-based Section 7-3 proposal by having it return in June in connection with the broader timing discussion, with staff permitted to begin preparing draft ballot language. The action was not final ballot placement and did not itself amend the Charter. The vote carried with four ayes and one abstention.

  **evidence:**

  - Vice Mayor Knox White withdrew an earlier motion after discussion.
  - Councilmember Vella remade the motion so the proposal would return at the second June meeting for the timing conversation, while staff could prepare ballot language for later consideration.
  - Councilmember Oddie seconded the motion.
  - The city attorney clarified that staff might draft language but would not bring it for approval at the second June meeting; formal ballot language would return later, along with any other items approved for the ballot.
  - The roll call recorded Councilmember Desai as abstaining and the measure carrying by four ayes and one abstention.

