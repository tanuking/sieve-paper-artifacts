  label: L
  summary: >
    The discussion raised concrete operational concerns about HR centralization and workforce
    management: inconsistent HR capacity across departments, slow and cumbersome hiring processes,
    difficulty filling critical vacancies such as correctional officer positions, stress and market
    conditions affecting recruitment and retention, and the risk of losing institutional knowledge
    as experienced employees retire.
  evidence:
    - "Departments had different funding structures and different levels of HR-team robustness."
    - "Councilmember Balducci said some departments were struggling with hiring and filling vacancies for critical jobs."
