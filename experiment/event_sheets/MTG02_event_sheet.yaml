  # Event Sheet — MTG02

  scope_note: This event sheet treats Item 8, Proposed Motion 2018-0398 concerning Jay Osborne and the King County Department of Human Resources, as the sampled segment. Adjacent consent-agenda and wastewater-budget discussion in the transcript is treated as out of scope for these slot entries.

  ## T — Topic / Framing

  ```yaml
  label: T
  summary: >
    The segment framed the item as the confirmation of Jay Osborne to lead the newly created
    King County Department of Human Resources, with discussion focused on standing up a more
    centralized HR department to improve consistency in HR practice, hiring, training,
    equity-and-social-justice implementation, workforce support, and succession planning.
  evidence:
    - "Proposed Motion 2018-0398 would confirm the executive's appointment of Jay Osborne to be the director of the King County Department of Human Resources."
    - "The Council approved the new Department of Human Resources last week, and Osborne had helped establish it after serving as director of the Human Resources Division."
    - "Osborne said having HR managers report directly to him would ensure consistency of practice, investigations, hiring protocol, and more efficient hiring and training across the county."
    - "He also described institutionalizing equity and social justice work, updating code and personnel guidelines, and improving recruitment outreach."
  source_vocabulary:
    - "confirmation"
    - "executive's appointment"
    - "King County Department of Human Resources"
    - "new Department of Human Resources"
    - "standing up a department"
    - "centralized personnel and human resources department"
    - "consistency of practice"
    - "investigations"
    - "hiring protocol"
    - "hiring and training of our workforce"
    - "equity and social justice"
    - "updated code and personnel guidelines"
    - "quality recruitment"
    - "succession planning"
  temporal_status:
    primary: currently_existing
    secondary:
      - already_occurred
      - future_effect
      - pending_future_handling
    notes:
      - The Department of Human Resources had recently been created and approved before this segment.
      - Osborne was already serving in a Human Resources Division leadership role.
      - The policy/operational effects of centralizing HR, updating guidelines, improving recruitment, and succession planning were future-facing or ongoing.
  source_context_for_fact_check:
    subject: >
      Confirmation and discussion of leadership for the King County Department of Human Resources,
      not Human Services. The chair initially misspoke as Human Services but corrected the framing to
      Human Resources, and staff described Proposed Motion 2018-0398 as confirming Osborne for the
      Department of Human Resources.
    policy_direction:
      - Standing up and centralizing HR functions in a new department.
      - Making HR practices, investigations, hiring protocol, training, and workforce management more consistent and efficient across county departments.
      - Institutionalizing equity and social justice practices in county workforce management.
      - Improving recruitment outreach and tracking workforce demographics.
      - Addressing succession planning and institutional knowledge transfer.
    target:
      - King County Department of Human Resources.
      - County HR managers and HR practices across departments.
      - King County workforce, described as about 15,000 employees.
      - County recruitment processes and workforce management practices.
  answer_locality:
    locality_type: distributed_within_item
    transcript_region: >
      From the start of Item 8 through the discussion of centralization, ESJ, recruitment,
      workforce demographics, support to workgroups, hiring challenges, and succession planning.
    notes:
      - Topic framing appears first in staff's description of Proposed Motion 2018-0398.
      - The policy direction is distributed across Osborne's answers to councilmember questions.
