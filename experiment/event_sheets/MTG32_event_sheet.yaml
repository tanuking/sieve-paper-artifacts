  label: T
  summary: >-
    The segment frames a City of Alameda proposal to reassess and restrict the City's
    banking and investment relationship with Wells Fargo. The policy direction is to
    identify existing Wells Fargo accounts and investments, prepare an RFP for city
    banking services, exclude Wells Fargo from that RFP process, and stop new Wells
    Fargo Securities investments until further Council direction. The target is the
    City's public funds, operating banking services, investments, and relationship
    with Wells Fargo / Wells Fargo Securities.
  evidence:
    - "identify all accounts with Wells Fargo and investments in Wells Fargo Securities"
    - "draft a request for proposal RFP for banking services for the city of Alameda"
    - "exclude Wells Fargo from the RFP process and refrain from making new investments in Wells Fargo securities until further counsel direction"
    - "we should we should be socially responsible with... millions of dollars of of our citizens"
    - "if we're going to be using banking services or having direct investments in a... banking institution... if there's bad behavior and we do nothing, then we're passively condoning it"
