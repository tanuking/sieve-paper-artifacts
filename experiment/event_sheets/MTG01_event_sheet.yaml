  # Event Sheet — MTG01

  ## Authoring note

  This event sheet is built from one sampled Denver City Council meeting transcript. The transcript includes several agenda items rather than a single-item segment. The slot entries therefore record source-grounded content for the segment as a whole, with item-specific facts preserved inside each slot-local fact-check context. ASR/OCR artifacts in the transcript are normalized only where the surrounding source context makes the item clear; otherwise, uncertainty is noted.

  ## Segment event inventory

  - Council Bill 430: final consideration and public hearing postponed to Monday, October 3, 2016, because Community Planning and Development needed to meet notice requirements; vote reported as 12 ayes.
  - Council Bill 509: rezoning for 3705 Shoshone Street and 1945 West 37th Avenue in the Highland neighborhood; passed with 12 ayes.
  - Council Bill 563: legislative rezoning in Sun Valley near the Decatur-Federal light rail station to implement the Sun Valley / Decatur-Federal station-area vision; passed with 12 ayes.
  - On-call Public Works contract resolutions: twelve on-call contracts, each described as $2.5 million for a total of $30 million, were adopted as a block; vote reported as 10 ayes, 1 nay, and 1 abstention.
  - Council Bill 585: service plan for Denver Connection West Metropolitan District; passed after public hearing.
  - Council Bill 626: alternative affordable-housing-fund bill was amended and ordered published as amended; amendment vote reported as no nays, and the publication vote reported as 7 ayes and 5 nays.
  - Council Bill 625: original affordable-housing-fund bill was discussed as the counterpart to Bill 626; a one-hour combined public hearing with Bill 626 was requested for September 19, 2016.
  - Resolution 759: photo red-light and photo-speeding radar-van contract; adopted with 10 ayes, 1 nay, and 1 abstention.
  - Proclamation 804: recognition of Paul A. Heineman of the Urban Drainage and Flood Control District upon retirement; adopted with 12 ayes.
  - Proclamation 805: congratulation of the Denver Outlaws for winning the 2016 Major League Lacrosse championship; adopted with 12 ayes.
  - Proclamation 806 is introduced at the transcript end, but its content is not included in the provided transcript segment.

