  ## Slot L — Concrete Concern

  ```yaml
  label: L
  summary: >
    The segment includes concrete concerns about specific harms, obstacles, and tradeoffs. EarthLinks and supporters warned that eight-story Sun Valley development could shade the organization's garden, reduce growing space, harm food-access work, affect homeless-service programming, and potentially weaken food sustainability in a food-desert context. Council members also questioned school proximity, street infrastructure, and whether rezoning alone would secure the adopted plan's street vision. For affordable housing, speakers raised concerns about inadequate funding, timing, reserve policy, competition with other city services, effects on development cost, and whether permanent revenue would be delayed. For on-call contracts, the concern was lack of visibility into utilization and spending. For Resolution 759, the concerns centered on red-light-camera fines, yellow-light timing, speeding, traffic-calming, and too few enforcement devices.
  evidence:
    - EarthLinks concern: "potential shading of our garden"
    - "we will basically close off about two thirds of our potential gardening space"
    - "food desert" and "serves many homeless"
    - "If the eight story buildings are built ... our garden will be cut"
    - "Is there a height limitation?"
    - "are we creating more problems down the road" about infrastructure and density
    - "how many of them are being utilized, how frequently are they utilized"
    - affordable-housing comments: "it's a great start, but it's not enough" and "does not create any new funds in 2017"
    - "it could result in cuts to base service levels"
    - Resolution 759: "we can get compliance, we can reduce accidents without ... fining people" and "People are driving like lunatics in the city"
