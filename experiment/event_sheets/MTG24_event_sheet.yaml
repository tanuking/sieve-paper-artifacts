  ## B — Agenda-Setting Background / Precipitating Context

  ```yaml
  label: B
  summary: >
    The resolution was shaped by Boston's historical participation in slavery and the slave trade, the absence of a prior municipal apology or accountability, and continuing racial disparities and institutional harms that speakers linked to that history.
  evidence:
    - Councilor Fernandes Anderson stated that Boston had not yet taken responsibility or apologized at the municipal level.
    - She cited historical facts: slavery likely began in Boston in 1638, was legalized in Massachusetts in 1641, and the Massachusetts Bay Colony slave codes were authored by John Winthrop.
    - She said Boston's local economy grew on unpaid enslaved labor, named Peter Faneuil as profiting from enslaved Africans, and cited estate inventories suggesting many white Bostonians possessed enslaved Africans.
    - She connected that history to present conditions, including generational trauma, economic and political disparities, city contracting disparities, systemic racism, and city departments not reflecting Boston's demographics.
    - Other speakers emphasized that Boston often highlights its abolitionist history while ignoring its active role in the slave trade and later racist structures.
