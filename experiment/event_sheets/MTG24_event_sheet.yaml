  label: S
  summary: >
    A recurring concern theme was that Boston cannot move toward racial healing, reconciliation, or repair unless it first tells the truth, acknowledges its role in slavery and racial harm, and accepts accountability for continuing impacts.
  evidence:
    - Councilor Fernandes Anderson said that before reconciliation, "we must speak the truth," and that without truth there is no reconciliation.
    - Councilor Louijeune connected equity to corrective action and acknowledgment of past policy harms.
    - Councilor Lara used the "knife" metaphor to argue that healing cannot begin without first admitting the wound exists.
    - Councilor Arroyo said admitting harm and taking accountability must come before healing and restoration.
    - Councilor Baker expressed discomfort with apology but supported it if his words could help the community heal.
    - Council President Flynn described the resolution as putting Boston on a path to address past mistakes and improve race relations.
