  ```

  ## Segment-level source summary

  Boston City Council considered Docket 0770, introduced by Councilor Fernandes Anderson, with additional original co-sponsors added without objection. The resolution was framed as an acknowledgment, condemnation, and apology for Boston's role in the transatlantic slave trade and for continuing harms experienced by Black Bostonians. Councilors discussed Boston's historical involvement in slavery, later racial harms and disparities, the need for truth before reconciliation, and the role of apology as a step toward healing and repair. After debate, the Council moved for suspension of the rules and adoption of Docket 0770. A roll-call vote was taken, the docket received a unanimous vote, and the resolution was adopted.

