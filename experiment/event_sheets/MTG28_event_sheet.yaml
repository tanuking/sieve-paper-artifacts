  # Event Sheet — MTG28

  ## Source files

  ## Segment-level source synopsis

  The segment covers Boston City Council consideration of Dockets 0762 and 0763, described in the transcript as the Mayor's return and modifications to the Council's amended FY23 annual appropriation and tax order. Councilor Fernandes Anderson, as Chair of Ways and Means, presented three partial-override recommendations. Partial override number one passed. A later revised version of partial override number three received 8 affirmative and 5 negative votes but did not pass because the override vote required a two-thirds threshold. The presiding officer then stated that Dockets 0762 and 0763 had been overridden in part and that this constituted approval of the FY23 city budget.

