  ## Slot T — Topic/Framing

  label: T — Topic/Framing

  summary: >
    The discussion framed Council Bill 19-0776 / 776 as a proposed right-of-way vacation at or near 2999 Chestnut / Chestnut and 29th. The substantive policy move was whether to advance a bill that could relinquish or vacate roughly 6,000 square feet of right-of-way, while members debated whether that land should remain available for transportation, public space, and future mobility uses.

  evidence:
    - "I move that council bill 776 be ordered published."
    - "This is on first introduction today, but it was actually postponed back a month ago. And so I'm urging my colleagues to vote no on this vacation."
    - "There's a fee for 6000 square feet of land, which is 1600 dollars. The plan for this location is an eight story hotel."
    - "It is currently being used for transportation as there is a bike docking station located there."
    - "Is there anyone here tonight who is opposed to the 2999 chestnut vacation?"
    - "We are presenting a good neighbor agreement... improving the right of way in the intersection of Chestnut and 29th..."

