  # Event Sheet — MTG30

  ## Segment-level note

  The sampled segment concerns Denver Council Bill 19-0776 / Council Bill 776, described in the transcript as the 2999 Chestnut right-of-way vacation. The in-session action was a motion to order the bill published on first introduction. The Council did not finally approve the underlying vacation in this segment; the merits and later handling remained pending after publication.

