  ## Slot L — Concrete Concern

  label: L — Concrete Concern

  summary: >
    Speakers raised concrete concerns that vacating the 2999 Chestnut right-of-way could give away a large public parcel despite existing or future transportation use, including a bike docking station and space for bikes or scooters that would not block mobility-impaired access. Other concrete concerns included neighborhood opposition, alleged persuasion tactics, the limits of relying on good neighbor agreements, and state-law constraints on how the city handles right-of-way vacations.

  evidence:
    - "71% objected and 42 total... objections were submitted from the neighborhood."
    - "It is currently being used for transportation as there is a bike docking station located there."
    - "That area specifically is the only public space where bikes and scooters can be parked without blocking access for people who are mobility impaired."
    - "I don't think it would be responsible for us to relinquish an area that can become a docking area for modern transportation uses."
    - "developer giveaway of 6000 square feet..."
    - "I'm somewhat frustrated by... state statute. That kind of makes it more difficult... for us to make decisions."
    - "persuasion tactics in trying to flip that 70% that was opposed..."
    - "the good neighbor agreement is null and void. Nobody is enforcing it on the city side because the city is not part of the good neighbor agreement."

