  ## Segment summary

  The segment concerns Docket 0265, an order related to accepting and expending Coronavirus State and Local Fiscal Recovery Fund / ARPA grant money. Councilor Bach framed the discussion around a prior hearing on potentially using ARPA funds to support the proposed Dorchester Field House, a project sponsored by Councilor Baker and associated with the Boys and Girls Club of Dorchester and the Martin Richard Foundation. Councilors discussed the proposed field house's youth, school-access, disability-access, athletic, performance, community, and economic-development value, while also raising concerns about green space, community voice, affordability, equitable access to ARPA resources, and precedent. The in-session procedural result was that Docket 0265 remained in committee.

