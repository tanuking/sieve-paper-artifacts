event_sheet_markdown: |
  # Event Sheet — MTG19

  ## Segment-level orientation

  The sampled segment covers an Alameda City Council referral on sanctuary-city-type protections and related community-value commitments. Councilmember Odie introduced the referral after describing concerns about the incoming Trump administration, possible mass deportations, possible religious-registration requests, and Alameda's stated commitment that "everyone belongs here." Public speakers then supported and opposed the referral. Council members discussed legal, financial, police-policy, timing, and Social Service Human Relations Board / SHRAB process issues. The Council ultimately voted unanimously to support the referral and direct staff to return with analysis and possible resolution language, while also accepting a commitment that constitutionally questionable federal requests would be reported to the Council immediately. The segment did not finally adopt a sanctuary-city ordinance or resolution.

  ---

  ## T — Topic/Framing

  ```yaml
  label: T
  summary: >
    The discussion framed a proposed Alameda sanctuary-city-type policy package and
    related values statement. The policy direction was to analyze and potentially
    strengthen local protections so Alameda police and city resources would not be
    used for federal immigration enforcement, mass deportation support, or religious
    registration, while reaffirming protections for vulnerable residents and an
    inclusive community. The targets were Alameda city policy, police-department
    practices, city-resource use, and residents who could be affected by immigration,
    religious-registration, civil-rights, or bias-related actions.
  evidence:
    - "we say that everybody belongs here ... we actually demonstrate to members [of] our community that actually everyone belongs here"
    - "Asking for an analysis of the potential and realistic financial impacts ... of actually having a sanctuary city ... type policy with our police department"
    - "general prohibitions on assistance or joint patrols with ICE ... don't ask policies ... prohibition on joint operations with ICE"
    - "if there is a movement to start arresting and doing mass deportations that our ... police department do not participate"
    - "we refuse to honor any request by the federal government to register anyone based on their religious affiliation"
    - "we do a statement of our values similar to what San Francisco did"
  source_vocabulary:
