      Alameda sanctuary-city-type protections and related community-values policy,
      not a general immigration reform debate alone.
    policy_direction:
      - Analyze financial/legal/practical implications of a sanctuary-city-type policy.
      - Consider strengthening or codifying existing police practices into a Council-backed resolution.
