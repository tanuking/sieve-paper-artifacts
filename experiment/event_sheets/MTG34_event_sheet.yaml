  ## B — Agenda-Setting Background / Precipitating Context

  label: B

  summary: The current update was shaped by prior Council direction in 2019 to develop a strategic vision through 2030, a February 2020 partnership with Arup, COVID-related delay or pause, the restart of the process, and the existence of many city plans that already contained substantial community feedback. The pandemic also shifted attention back toward basic community needs.

  evidence:
    - "In the early in October of 2019, the City Council directed city staff to develop a strategic vision for the city that would reflect the next ten years to 2030."
    - "We began this journey in partnership with Arup Consulting Firm in February of 2020. However, due to COVID, we were delayed."
    - "We started that effort in 2019, and then along with many things, we had to take a pause during COVID and we've restarted that effort."
    - "Just about all of our city departments have their own strategic plans ... All of which elicited community feedback as part of their planning process. It wasn't necessary to start from scratch."
    - "I think the impact of the pandemic has shifted some view ... a little bit of a step back and thinking about ... taking care of the basic needs of our community."

