  ## S — Shared Concern Synthesis

  label: S

  summary: A recurring concern theme was that the strategic vision must be equitable and representative: it should address areas of greatest need, ensure no neighborhood is left behind, include hard-to-reach residents and those affected by the digital divide, and make community voices part of planning and decision-making.

  evidence:
    - "Equity must be ... integrated into our policies and program design as well as implementation and that resident interests are represented."
    - "Increasing civic engagement and working to create stronger community relationships and communication structures to ensure community voices are engaged in planning and decision making."
    - "Department Leadership and steering committee also focused on the importance of addressing the areas of greatest need in the city and working to prioritize resources."
    - "Developing and strengthening mechanisms for equitable service investments, utilizing an equity lens and taking a long term planning view."
    - "Make sure no neighborhood is left behind."
    - "What's more important is what the community sees."
    - "Those folks that don't have a computer, that don't have a cell phone, that are victims of our digital divide and really trying to get their visions included as well."

