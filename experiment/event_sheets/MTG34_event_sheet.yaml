  # Event Sheet — MTG34

  segment_type: City Council study session
  primary_item: Item 19 — study session recommendation to conduct a study session to receive and file an update on the city's strategic vision efforts

  ## T — Topic/Framing

  label: T

  summary: The segment is framed around Long Beach's strategic vision / strategic planning effort through 2030: an overarching roadmap that pulls together existing city strategic plans and additional Council, staff, and community input, using equity and resiliency lenses to focus and prioritize city work after the pandemic.

  evidence:
    - "Item 19 is the study session recommendation to conduct a study session to receive and file an update on the city's strategic vision efforts."
    - "In 2019, the City Council embarked on a effort to create an updated strategic plan looking to the future or strategic vision."
    - "This is kind of an overarching effort to pull all of those together and to really create a document that helps us kind of focus and look to the future."
    - "The City Council directed city staff to develop a strategic vision for the city that would reflect the next ten years to 2030."
    - "Our goal of this work is to develop a ... nine year now strategic vision for our city that reflects your voices, the voices of our teams and the voices of our community by way of using an equity and resiliency lens in this design process."
    - "This vision will help focus and prioritize our work as we emerge from this pandemic and move toward an even brighter future."

  source_vocabulary:
    - strategic vision
    - updated strategic plan
    - overarching effort
    - roadmap for the future of Long Beach
    - 2030
    - equity and resiliency lens
    - focus and prioritize our work
    - statement of possibility
    - strategic vision action agenda

  temporal_status:
    primary: currently_existing
    additional:
      - future_effect
