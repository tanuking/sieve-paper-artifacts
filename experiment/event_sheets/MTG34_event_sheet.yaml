    notes:
      - The strategic vision process was already underway and was being updated during the session.
      - The vision is future-facing toward Long Beach in 2030.
      - Deeper Council review, action-agenda drafting, approval, and final sharing remained pending.

  source_context_for_fact_check:
    subject: Long Beach's strategic vision / strategic planning process through 2030.
    policy_direction:
      - Develop or update an overarching strategic vision / roadmap for Long Beach.
      - Pull together themes from existing departmental and focus-area strategic plans rather than starting from scratch.
      - Use equity and resiliency as design lenses.
      - Focus and prioritize city work as Long Beach emerges from the pandemic.
    target:
      - City of Long Beach strategic planning and service priorities.
      - City government, departments, staff teams, Council districts, and the Long Beach community.
    not_supported_as_T:
