  ## B — Agenda-Setting Background / Precipitating Context

  ```yaml
  label: B
  summary: >
    The current resolution was shaped by a history of racist displacement in Seattle's
    Central District, including urban renewal, redlining, forced sales under threat of eminent
    domain, and later rent-driven displacement. The sponsor described the 1969 forced sale
    of New Hope Church and neighboring Black homeowners' land for Spruce Street Mini Park,
    the Atlantic Urban Renewal Project / Neighborhood Improvement Project, and organizing
    by New Hope, Black clergy, housing advocates, and community members as context for
    the resolution.
  evidence:
    - The item itself was introduced as concerning the impact of Seattle's Urban Renewal Program in displacing Black community members from the Central Area.
    - Reverend Jeffrey's op-ed was described as saying that "in 1969, the city forced the New Hope Church and black homeowners" to sell land "under the threat of eminent domain" for Spruce Street Mini Park.
    - The sponsor said urban renewal "spelled displacement and destruction for black communities in the Central District."
    - The sponsor named the "Atlantic Urban Renewal Project" and later "Neighborhood Improvement Project" as the renewal project names.
    - The property New Hope Church was forced to relinquish was described as being estimated at "$2 million today" and "over eight times" the inflation-adjusted sale amount.
    - The sponsor also tied the resolution to public comments, a July 31 rally, New Hope organizing, and the People's Budget campaign.
  source_vocabulary:
    - "1969"
    - "forced the new Hope Church and black homeowners"
    - "threat of eminent domain"
