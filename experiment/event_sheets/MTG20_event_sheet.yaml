event_sheet_markdown: |
  # Event Sheet — MTG20

  ## Segment anchor

  Agenda Item 18 concerned Resolution 32015, described in the transcript as addressing the impact of Seattle's Urban Renewal Program in displacing Black community members from the Central Area, supporting demands to fund quality affordable social housing to prevent and reverse displacement, and urging the Office of Housing to fund the New Hope affordable housing project. The segment ended with a roll-call vote in which the motion carried and the resolution was adopted.

  ---

  ## T — Topic/Framing

  ```yaml
  label: T
  summary: >
    The discussion framed Resolution 32015 as a response to Seattle's past and ongoing
    displacement of Black Central District community members through urban renewal,
    redlining, exclusionary zoning, and rising rents. The policy direction was to acknowledge
    those racist displacement policies, support reparative affordable social housing, urge
    funding for the New Hope Family Housing Project, and expand progressive revenue for
    community-rooted affordable housing.
  evidence:
    - "Resolution 32015" was introduced as being "regarding the impact of Seattle's Urban Renewal Program in displacing black community members from the central area."
    - The item was also introduced as "supporting community demands to fund quality, affordable social housing to prevent and reverse displacement" and "urging the Office of Housing to fund the Affordable Housing Project."
    - Councilmember Sawant said the resolution would "acknowledge the city's past policies of racist displacement, such as redlining, urban renewal" and urge departments to look for reparative opportunities.
    - The sponsor described the New Hope Family Housing Project as creating "86 affordable homes in the Central District" for families with historic roots in the neighborhood.
    - Councilmember Mosqueda connected the effort to funding affordable housing rooted in and driven by communities of color, especially Black communities in the Central District.
  source_vocabulary:
