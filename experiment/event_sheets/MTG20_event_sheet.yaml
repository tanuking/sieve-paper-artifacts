    - "Atlantic Urban Renewal Project"
    - "Neighborhood Improvement Project"
    - "Seattle Urban Renewal Enterprise"
    - "redlining"
    - "gentrification"
    - "skyrocketing rent"
    - "rally we held on Saturday, July 31st"
    - "public comment"
    - "People's Budget campaign"
  temporal_status:
    primary: already_occurred
    additional:
      - currently_existing
      - recurring_concern
    notes:
