    - The sponsor said the People's Budget movement would need to "follow this up in the autumn" to win funding and compensate community members displaced over decades.
    - Mosqueda said she looked forward "as the budget process starts" to making sure the efforts are funded in the fall process.
    - Mosqueda said the project was "somewhere between pre-development and shovel ready" and likely to apply for all funds.
    - Mosqueda said they would work through the year's budget to remove covenant and partnership requirements.
    - The sponsor's closing remarks called for continued organizing around rent control, renter protections, affordable housing, and increasing the Amazon tax.
