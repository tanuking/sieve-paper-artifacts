      - The urban renewal projects were named as the Atlantic Urban Renewal Project and later the Neighborhood Improvement Project.
      - The property relinquished by New Hope Church was estimated in the segment at $2 million today, over eight times the inflation-adjusted sale amount.
      - Community organizing, public comments, and a July 31 rally supported the resolution and related funding demands.
