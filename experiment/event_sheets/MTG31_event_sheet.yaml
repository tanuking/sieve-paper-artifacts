  ## Slot N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  summary: >
    The carried review-first motion required a short independent third-party review
    of the recycling RFP process. The City Attorney was to select the third-party
    reviewer / be the clean point of city-side involvement, and the review was to
    return findings or recommendations to Council by no later than June 14 if possible.
    The review scope included written protests and comments, verbal allegations,
    RFP forms, proposer information and how it was used, the basic RFP process,
    requests for additional information, the consultant's role, and numeric inputs
    such as container replacement and recyclable-value calculations. After the review,
    Council would decide whether to award the contract as recommended or begin the
    process again.
  evidence:
    - "I'd like the city attorney's office to select the vendor who conducts the review."
    - "I would recommend June 14th. That comes back by the city attorney with recommendations. Or no later than."
    - "We're going to conduct the review that takes ... between 30 and 60 days, as long as it does not trigger the contract extension."
    - "A review of all the written protests, the comments ... verbal allegations ... forms ... information submitted by the proposers ... basic steps in the RFP process, including the request for additional information ... roles of our consultant..."
    - "The scope should involve ... the replacement of the containers and the value of the recyclables, whatever criteria was factored into the equation..."
