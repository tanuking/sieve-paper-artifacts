  ## Slot T — Topic/Framing

  ```yaml
  label: T
  summary: >
    The segment was substantively about Long Beach's citywide recyclable collection
    services procurement. The policy move under discussion shifted from the agenda's
    proposed award of the recycling contract to Waste Management to a narrower course:
    conduct an independent review of the recycling RFP process first, then let the
    Council decide whether to award the contract as recommended or restart the process.
  evidence:
    - "Recommendation to award a contract to Waste Management for recyclable collection services in an annual amount not to exceed 3.5 million citywide."
    - "Over the past few weeks, there's been a huge amount of misinformation provided about the procurement process with regards to the recycling RFP."
    - "What we're doing is ... conduct the review ... Based on that review, the council will decide either to award the contract as recommended or we begin the process again."
  source_vocabulary:
