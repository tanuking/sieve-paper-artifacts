      - hypothetical_or_risk
    notes:
      - The RFP process, proposed award, and existing recycling collection contract were current source-side conditions.
      - The independent review and later Council decision were pending future handling.
      - Restarting the procurement process remained conditional on what the review found.
  source_context_for_fact_check:
    subject: City of Long Beach citywide recyclable collection services procurement / recycling RFP.
    policy_direction:
      - The agenda item originally proposed awarding the recycling collection services contract to Waste Management.
      - The adopted course did not immediately award the contract and did not immediately reject all proposals or start a rebid.
      - The adopted course was to conduct an independent review first, then decide whether to award as recommended or begin the process again.
    target:
