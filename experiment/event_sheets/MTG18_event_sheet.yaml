  ## Slot N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  summary: >
    Resolution 31698's operative payload directed FAS to obtain independent third-party
    cost estimates at the 60% and 90% construction-document stages, conduct a full racial
    equity toolkit analysis of the North Precinct facility's design, operations, programmatic
    assets, and cost with specified partner departments and community engagement, report
    to the relevant committee, provide regular progress and cost-risk reports, complete
    the RET analysis around October 3, 2016, use the RET results to inform later budget
    decisions on total project cost, and allocate proceeds from any sale of the existing
    North Precinct property or building to affordable housing needs.

  evidence:
    - "[It] would require that the Finance and Administrative Services Department hire an independent third party cost estimator... with an eye towards finding additional cost savings."
    - "[Cost estimate analysis] at the 60% construction documents submittal phase, and then again at the 90% construction documents submittal phase."
    - "[It] would direct ... a full racial equity toolkit analysis of the facility's design and operations, including the interior and exterior building design for all planned programmatic assets [and] cost."
    - "FAS will be required to solicit community perspectives from historically underrepresented populations, vulnerable populations... historically and disproportionately impacted by police action..."
    - "[The RET analysis must] be completed by October 3rd of 2016."
    - "The results ... will help to inform the Council's decision on what is the appropriate total project cost... in the course of the City Council's ordinary budgeting process."
    - "The resolution also directs FAS to provide ... regular progress reports... [including] current project status... life to date expenditures... most recent total project cost estimate... budget risk issues."
    - "All the proceeds from the sale of either the property or the building where the current north precinct is sited would be wholly allocated to ... affordable housing needs."

  source_vocabulary:
    - hire an independent third party cost estimator
    - estimated project costs are accurate and reasonable
    - additional cost savings
    - 60% construction documents submittal phase
    - 90% construction documents submittal phase
    - full racial equity toolkit analysis
    - facility's design and operations
    - interior and exterior building design
    - planned programmatic assets
    - historically underrepresented populations
    - vulnerable populations
    - disproportionately impacted by police action
    - victims of crime
    - intended community engagement plan
    - October 3rd of 2016
    - 4 to 6 weeks before budget decisions
    - approximately eight weeks
    - regular progress reports
    - life to date expenditures
    - budget risk issues
    - proceeds from the sale
    - affordable housing needs

  temporal_status:
    primary: future_effect
    secondary:
      - pending_future_handling
      - completed_in_session
    notes:
      - The resolution was adopted in-session, but most payload requirements were future-facing directives.
      - The RET analysis, cost estimates, progress reports, community engagement, property-sale allocation, and budget use were to occur after adoption.
      - The October 3, 2016 RET date was a future deadline discussed with possible wiggle room.

  source_context_for_fact_check:
    payload_carrier: Resolution 31698
    payload_content:
      - FAS must hire an independent third-party cost estimator to assess whether estimated project costs are accurate and reasonable and to look for additional cost savings.
      - Independent cost-estimate analysis must occur at two construction-document submittal phases: 60% and 90%.
      - FAS, with assistance from the Seattle Office for Civil Rights, Department of Neighborhoods, and Seattle Police Department, must conduct a full racial equity toolkit analysis.
      - The RET analysis covers the facility's design and operations, including interior and exterior building design, planned programmatic assets, and cost.
      - FAS must solicit community perspectives from historically underrepresented populations, vulnerable populations, people most likely to interact with police, people historically and disproportionately impacted by police action, and people most likely to be victims of crime.
      - FAS must report its intended community engagement plan to the Gender Equity, Safe Communities and New Americans Committee.
      - RET results must be provided to that committee and are intended to inform the later Council decision on the appropriate total project cost during the budget process.
      - FAS must provide regular written progress reports to the full Council and progress reports to the committee.
      - Progress reports include current project status, design and community engagement efforts, outcomes of community engagement, life-to-date expenditures, most recent total project cost estimate with explanation of changes, and budget risk issues.
      - Proceeds from a sale of the existing North Precinct property or building would be wholly allocated to meeting the city's affordable housing needs.
    payload_scope:
      - North Precinct Capital Project / proposed North Precinct facility
      - Project cost, design, operations, community engagement, training-facility and community aspects
      - Existing North Precinct property or building if sold
    numeric_values:
      - value: 60%
        meaning: first construction-document submittal phase for independent cost-estimate analysis
      - value: 90%
        meaning: second construction-document submittal phase for independent cost-estimate analysis
      - value: October 3, 2016
        meaning: stated completion date for the RET analysis, with discussion that OCR might need some flexibility
      - value: approximately eight weeks
        meaning: time OCR said it needed to complete the RET analysis well
      - value: approximately 4 to 6 weeks
        meaning: expected time between RET results and late-November budget decisions
      - value: end of November
        meaning: stated timing for Council budget vote
      - value: several millions of dollars
        meaning: rough City Budget Office indication of possible value from the existing property/building, without a completed evaluation
    temporal_status:
      - completed_in_session for adoption of the resolution carrying these terms
      - future_effect for the directives and deadlines
      - pending_future_handling for implementation and budget use

  answer_locality:
    - Primarily in Councilmember González's opening explanation of the resolution.
    - Reinforced by later comments from Harrell, Herbold, O'Brien, and Johnson about cost savings, RET work, and later budget decisions.

