  # Event Sheet — MTG18

  ## Source segment

  ## Segment overview

  The sampled segment concerns Seattle City Council agenda item 14, Resolution 31698, relating to Council direction on budget and other matters for the North Precinct Capital Project. Councilmembers discussed whether the resolution should proceed immediately or be held for more community review, debated the cost and design of the proposed North Precinct facility, described the resolution's required cost review and racial equity work, rejected a motion to hold the resolution until September 12, and then adopted Resolution 31698.

