  ## Slot N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  summary: >-
    The operative payload of the approved authorization centered on an Alameda Family Services agreement for mental-health services, with a first-year amount not to exceed $500,000 and an option to extend for a second year with total two-year authority not to exceed $1 million. Staff recommended a combined options 1A/1C model that would provide 24/7 coverage from program start, access to an on-call licensed clinician during non-business hours, two full-time AFS staff roles plus several part-time FTE supports, case management, service linkage, follow-up care, and coordination with the fire-led pilot. Council amendments/direction added iterative contract flexibility, periodic reporting/check-ins, and agenda handling before extension.
  evidence:
    - "an amount not to exceed $500,000 for one year, with an option to extend for an additional year for an amount not to exceed 1 million for two years"
    - "two full time staff people involved in the program ... the program supervisor and the crisis response case manager"
    - "several part time FTE positions ... to be able to support all of the needs of the pilot program"
    - "24, seven ... coverage from the start of the program, including access to an on call licensed clinician during non-business hours"
    - "the expectation ... is that they will call back within 15 minutes. The RFP indicated that ... 90 minutes ... would be the longest possible"
    - "One would be a telehealth connection between our first responder and their agency"
    - "we write the contract in such a way that whatever ends up in Schedule A ... can be changed by the city, with agreement ... with 45 days or 60 days ... notice"
