  ## Slot S — Shared Concern Synthesis

  ```yaml
  label: S
  summary: >-
    A recurring problem-side concern across public comment and Council discussion was that delaying the alternative mental-health response would prolong an unacceptable status quo and expose vulnerable community members to continued harm or unnecessary police contact. Speakers repeatedly emphasized that the pilot needed to move forward, that 24/7 coverage was important, and that imperfection in a pilot should not be used as a reason for further delay.
  evidence:
    - "Further delay is an ... unjustified extension of the status quo. That is simply unacceptable."
    - "delays will result in more harm in our community"
    - "the need is not Monday through Friday 9 to 5"
    - "this absolutely has to be a 24 seven kind of program"
    - "the more delays that we make ... People ... We're taking risks right now"
    - "It's a pilot. Let's get it started. We can make tweaks along the way."
    - "this is the time to act, that this is a pilot and it does not have to be perfect"
