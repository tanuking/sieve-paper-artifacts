  # Event Sheet — MTG10

  ## Segment

  - **segment_focus**: City Council consideration of authorizing the City Manager to negotiate and execute an agreement with Alameda Family Services for mental-health services supporting Alameda's alternative response to mental-health crisis calls.
  - **scope_note**: The transcript begins the next agenda item after this vote. This event sheet treats the mental-health alternative-response item as the sampled segment and excludes the later Davey Park / Bay Restoration Authority grant item.

  ---

