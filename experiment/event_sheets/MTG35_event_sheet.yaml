  ## N — Outcome-Near Condition / Operative Payload

  ### label

  `N`

  ### summary

  The action's operative payload was to have the City Council file a complaint about the allegedly unidentified November 8, 2016 election mailers and to follow up on the FPPC investigation results. The complaint process was described as a state FPPC process involving submission of copies of the mailers, not as a city investigation or city enforcement proceeding.

  ### evidence

  - Mayor Spencer described the complaint as simple: using a website dropdown for unidentified mailers, sending copies, and allowing the FPPC to look into it.
  - She said the complaint would not require staff to conduct an independent investigation.
  - The City Attorney said the Council could decide whether the mayor, attorney, staff, or Council would take action, but the City itself had no enforcement jurisdiction.
  - The final motion was for the City Council to file a complaint and follow up to see what the investigation results were.

