  ### summary

  After the Council vote, the unresolved tail was the subsequent filing and follow-up path: the Council complaint would be added to an FPPC process that was already investigating related complaints, and the Council would follow up to see the investigation results. Any FPPC determination, fines, referral, or other enforcement outcome remained pending after the meeting.

  ### evidence

  - The City Attorney said the FPPC had already received complaints and sworn complaints and had notified a complainant that it would investigate.
  - The City Attorney explained that the FPPC could assess fines or, in egregious cases, refer matters to a district attorney, depending on what the investigation found.
  - The Vice Mayor supported filing the complaint and following up, possibly assigning a councilmember to ask where the complaint stood and report out later.
  - The adopted motion included filing the complaint and following up to see the results of the investigation.

