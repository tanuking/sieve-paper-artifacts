  ## B — Agenda-Setting Background / Precipitating Context

  ### label

  `B`

  ### summary

  The referral was prompted by two election mailers from the most recent campaign season that allegedly lacked legally required identifying information. Mayor Spencer said she could not submit a complaint in her mayoral capacity without Council approval, and the City Attorney explained that FPPC complaints had already been filed and that the FPPC had notified a complainant it would investigate. This background shaped why the Council considered adding its institutional voice to the complaint process.

  ### evidence

  - Mayor Spencer said there were two election mailers from the last campaign season that did not include identifying information required by California law.
  - She said she contacted the relevant agency about making a complaint and was informed that prior mayors and councilmembers had made complaints, but that given Alameda's form of leadership she could not make the complaint as mayor without Council approval.
  - The City Attorney stated that the City and City Attorney's office had no jurisdiction over the issue and that the FPPC was the state body responsible for election issues like this.
  - The City Attorney said complaints, including sworn complaints, had already been received and that the FPPC had notified one complainant as of November 30 that it would investigate.

