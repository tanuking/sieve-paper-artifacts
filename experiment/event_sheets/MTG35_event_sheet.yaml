event_sheet_markdown: |
  # Event Sheet — MTG35

  ## 0. Metadata

  ## 1. Segment scope

  ### 1.1 Dominant event

  The sampled segment centers on an Alameda City Council referral asking whether the Council should authorize or direct a complaint to the Fair Political Practices Commission (FPPC) about November 8, 2016 election mailers that allegedly lacked legally required identifying information. After public comments, legal clarification, and Council discussion, the Council approved a motion for the City Council to file a complaint and follow up on the investigation. The motion carried 3-1, with one abstention.

  ### 1.2 Source-side caution

  The transcript repeatedly renders the state agency inconsistently as `FEC`, `FPC`, `SPC`, or similar variants. In context, the relevant agency is the California Fair Political Practices Commission (FPPC). The event sheet uses `FPPC` as the normalized agency name while preserving the transcript's source vocabulary where useful.

  ---

  ## 2. Slot entries

  ## T — Topic / Framing

  ### label

  `T`

  ### summary

  The segment was framed around using a formal FPPC complaint to address allegedly unidentified November 8, 2016 election mailers and to reinforce compliance with campaign disclosure / identification rules. The substantive policy direction was not merely to condemn negative campaigning, but to pursue state-level complaint handling for mailers alleged to lack required sender identification. The target was the unidentified campaign mailers and the disclosure-compliance expectations governing campaign communications in Alameda elections.

  ### evidence

  - The agenda item was introduced as authorizing the City Council to direct staff to submit a complaint to the Fair Political Practices Commission regarding November 8, 2016 election mailers.
  - Mayor Spencer said two mailers from the last campaign season did not include identifiable information required by California law.
  - She distinguished the referral from a general objection to negative campaigning, saying the issue was the unidentified nature of the mailers and the resulting circumvention of campaign-finance reporting rules.
  - Council discussion repeatedly contrasted a broader resolution against negative campaigning with the specific complaint over allegedly unidentified campaign material.

