  ## Segment overview

  The sampled segment concerns Denver City Council's consideration and adoption of Proclamation 201, Series of 2015, supporting the START by Believing Public Awareness Campaign. The proclamation frames sexual violence as a serious community concern, cites reporting and service statistics, supports the campaign launch on Friday, April 17, and declares that day to be START by Believing Day throughout the City and County of Denver. Councilmembers then discuss underreporting, survivor support, victim services, community response, and the importance of believing victims. After roll call, the proclamation is announced as adopted and accepted by Manager of Safety Stephanie O'Malley on behalf of the public-safety team.

