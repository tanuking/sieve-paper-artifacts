  ## Slot N — Outcome-Near Condition / Operative Payload

  ```yaml
  label: N
  summary: >
    The operative payload of Council Bill 119758 was to waive or remove late fees and interest charges on delinquent utility accounts for Seattle City Light and Seattle Public Utilities customers during the emergency period. The waiver would last until the mayor's emergency declaration ends or August 1, whichever comes first. Substitute version 2 clarified that small-business income is based on 2019 annual receipts. Amendment 1 added nonprofit organizations defined under Seattle Municipal Code 5.30.040.C, described as 501(c)(3) organizations, to make clear that nonprofits would receive the waiver.
  evidence:
    - "temporarily removing the charge of interest on delinquent utility consumption and utilization accounts..."
    - "This ordinance would waive late fees and interest charges from both Seattle City Light and Seattle Public Utilities until the mayor's emergency declaration is terminated, or August one, whichever comes first."
    - "version two, the substitute makes it easier to administer this ordinance by clarifying that the income for small businesses is based on the annual receipts from 2019."
    - "Amendment number one... will clarify, make it crystal clear that nonprofits are also getting the waiver of the late fees."
    - "customers that are nonprofit organizations as defined under Seattle Municipal Code Section 5.30.040. C and basically saying that's 501c3 organization."
  source_vocabulary:
