event_sheet_markdown: |
  # Event Sheet — MTG21

  ## Segment-level orientation

  The segment concerns Seattle City Council agenda item 2, Council Bill 119758, relating to Seattle City Light and Seattle Public Utilities. The bill temporarily removes or waives interest and late-fee charges on delinquent utility consumption and utilization accounts during the COVID-19 emergency. During the segment, the Council considered and passed a substitute, considered and passed Amendment 1 covering nonprofit organizations, and then passed the bill as amended by a 9-0 vote.

