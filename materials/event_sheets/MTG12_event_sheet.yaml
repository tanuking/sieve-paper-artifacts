    Participants identified concrete concerns about local E911 modernization: the
    rapid pace and cost of technology changes, lack of federal or state local funding,
    projected revenue shortfalls, possible new network costs, and the need to keep
    the system people-centered while changing its technical architecture.
  evidence:
    - "local implementation ... has been a challenge both in terms of how to best keep up with that technology, which is just changing so rapidly and how to pay for the new systems because it will be more expensive than what we're doing now"
    - "neither the federal nor the state government has provided any local funding for that new 911 initiative"
    - "projected system expenditures are going to outstrip revenues, leading to a significant deficit"
    - "the major drawback is that single platform architectural will likely incur new networking costs of about $700,000. Per year"
    - "there are some pretty big decisions that are still remaining to be done"
    - "This is a technology, world and environment ... But this is also a people job and this is a people world. People called 911. They want to hear a voice"
    - "we have this constant debate about people and and technology not versus technology"
