  ## L — Concrete Concern
  
  ```yaml
  label: L
  summary: >
    Members raised concrete concerns about whether the funding design could create
    operational or equity problems: the 70% low-income facility target might be too rigid
    or economically impractical; matching requirements could burden smaller organizations;
    capital-only investments might miss poor, minority, immigrant, refugee, or home-based
    providers; geographic equity could dilute targeting of disadvantaged populations; and
    kinship caregivers lacked training support for navigating school services such as IEPs.
  evidence:
    - Councilmembers questioned how the 70% low-income requirement would be determined or enforced and whether it would work in the marketplace.
    - Members discussed the need for some market-rate families to make early-learning centers financially viable, referencing consultant assumptions such as 60/40.
    - A member objected that disadvantaged minority communities may not have money for building expansion and may rent facilities, making capital-heavy funding harder to access.
    - A member worried that geographic equity could become a district-distribution argument rather than targeting the most disadvantaged groups.
    - Amendment 6 discussion described kinship caregivers as receiving no training funds for IEP navigation and other educational-advocacy needs.
  source_vocabulary:
    - concerns
    - rigidity
    - practical implications
    - marketplace
    - market rate children
    - unnecessary barriers
    - matching funds
    - disadvantaged minority communities
    - capital investments
    - geographic equity
    - kinship care
    - IEP
  temporal_status:
    primary: hypothetical_or_risk
    notes:
      - The concerns were raised as risks, tradeoffs, and design problems during the meeting.
      - Some concerns related to future implementation and future funding access.
  source_context_for_fact_check:
    obstacle_content:
      - Potential rigidity or impracticality of requiring early-learning facilities to serve at least 70% children from families at or below 200% FPL.
      - Concern that centers may need a mix of low-income and market-rate families to survive financially.
      - Concern that matching requirements could be difficult for smaller organizations.
      - Concern that disadvantaged communities or organizations that rent facilities may have less ability to benefit from capital-focused funds.
      - Concern that geographic-equity language might conflict with targeting populations with greatest disadvantage.
      - Concern that kinship caregivers receive no training support for educational advocacy such as IEP navigation.
    local_anchor:
      - King County and its council districts were the institutional/geographic frame.
      - Concerns referenced poor, minority, immigrant, refugee, foster-care, kinship-care, and other target populations, but not always a single named neighborhood.
