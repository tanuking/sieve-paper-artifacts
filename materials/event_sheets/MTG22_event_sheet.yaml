  ## Segment-level note
  
  This sampled segment concerns Motion 2019-0245, the Puget Sound Taxpayer Accountability Act funding plan for King County educational needs. The segment focuses on how the Council should structure and advance allocations across early learning, K-12, higher education, community supports, facilities, and implementation planning for vulnerable and underserved children and youth, while final full-Council handling remained pending after the segment.
  
  ## T — Topic/Framing
  
  ```yaml
  label: T
  summary: >
    The segment framed Motion 2019-0245 as the Puget Sound Taxpayer Accountability Act
    funding plan: roughly $318 million over 15 years for King County educational needs,
    directed toward vulnerable and underserved children and youth. The policy move being
    discussed was how to allocate and structure those funds across early learning,
    K-12, higher education, community-based supports, facilities, implementation planning,
    and target-population safeguards.
  evidence:
    - "Motion 2019 245 ... Puget Sound Taxpayer Accountability Act ... directs $318 million to King County over the next 15 years ... on the educational needs of students and youth in King County."
    - "children and youth of color ... families at or below 200% of the federal poverty level ... homeless ... foster care ... juvenile justice ... disabilities ... LGBTQ or otherwise vulnerable."
    - "the Interline Motion ... set out three educational areas ... early learning, K-12 and higher education."
    - "the striking amendment allocates ... resources" and clarifies target populations, low-income definition, funding buckets, and implementation planning.
