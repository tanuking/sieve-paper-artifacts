    notes:
      - The payload sets future allocation, governance, implementation, and reporting requirements.
      - Amendment adoptions occurred in-session.
      - Some allocation issues remained subject to future full Council refinement.
  source_context_for_fact_check:
    payload_carrier:
      - Motion 2019-0245 as amended by striking amendment S-2 and adopted amendments.
      - Individual amendment payloads attach to the amendment numbers as discussed.
    payload_content:
      - Amendment 1 inserted 7.5% for evaluation/administration/technical support.
      - S-2's original staff briefing described up to 10% before Amendment 1.
      - S-2's original staff briefing described 55% of remaining funds for early learning programs and facilities, including early-intervention facilities.
      - Amendment 2 was adopted with the spoken purpose of removing early-learning programs from eligible use and focusing the early-learning bucket on facilities.
      - Early-learning facility policy included a target/condition that facilities serve at least 70% children from families at or below 200% of the federal poverty level, stated as "to the greatest extent possible" in discussion.
      - Facilities should be in access deserts, with the definition to be developed later in the implementation plan.
      - The remaining 45% was briefed as 40% K-12 through King County Promise, 40% higher education through King County Promise, and 20% community-based organizations integrated with K-12.
      - K-12 and higher-ed King County Promise recipients were discussed as requiring matching contributions.
      - The community-based-organization 20% of the 45% was clarified as not requiring a match and not being subordinate to King County Promise.
      - The implementation plan was due back in eight months and included governance, allocation, culturally appropriate and trauma-informed strategies, financial planning, facility policies, access-desert definition, alignment, leverage, and evaluation.
      - Amendment 9 added representatives from each council district office to implementation-plan consultation.
      - Amendment 9.5 added advisory-group expertise criteria.
      - Amendment 10 added geographic equity as a lens for early-learning facility policies.
    payload_scope:
