  ## N — Outcome-Near Condition / Operative Payload
  
  ```yaml
  label: N
  summary: >
    The action-carried payload concerned how PSTAA funds would be allocated and governed.
    As discussed and amended, the package used a 7.5% cap/place-holder for evaluation,
    administration, and technical support; kept the main allocation structure around early
    learning and the remaining K-12/higher-education/community-based buckets; focused the
    early-learning bucket on facilities after Amendment 2; required implementation-plan
    work; and added consultation, advisory expertise, and geographic-equity language.
  evidence:
    - Staff described S-2 as allocating up to 10% for evaluation, administration, and technical support before Amendment 1 changed the number to 7.5%.
    - S-2 allocated 55% of remaining funds to early learning programs/facilities as originally briefed, with facilities serving at least 70% children from families at or below 200% of the federal poverty level "to the greatest extent possible" and located in access deserts to be defined later.
    - Amendment 2 was adopted to remove early-learning programs from eligible use and focus the early-learning bucket on facilities.
    - The remaining 45% was briefed as K-12 and higher education support: 40% K-12 through King County Promise, 40% higher education through King County Promise, and 20% community-based organizations integrated with K-12 and serving target populations.
    - Staff and members clarified that the community-based-organization 20% of the 45% did not require matching funds and was not subordinate to King County Promise.
    - The implementation plan was due back to Council in eight months and included governance, allocation process, culturally appropriate and trauma-informed strategies, financial plan, facility policies, access-desert definition, alignment with existing county investments, post-secondary alignment, leverage opportunities, and periodic evaluation.
    - Amendment 9 added consultation with a representative from each council district office.
    - Amendment 9.5 added advisory-group expertise in racism, systemic racism, multicultural curriculum, childhood trauma, and restorative justice/corrective-action practices.
    - Amendment 10 added a geographic-equity lens for early-learning facility policies.
  source_vocabulary:
