  ## Segment-level source note
  
  The segment covers Long Beach City Council Item 14, a Fire Department recommendation
  to refer consideration of renaming the Long Beach Fire Department Regional Training
  Center after Captain David Rosa to the Housing and Neighborhoods Committee. Speakers
  frame the item as a memorial recognition of Rosa's service and training legacy, and
  the in-session action is a carried motion on the referral rather than a completed
  final renaming.
  
