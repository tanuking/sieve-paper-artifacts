  ## Slot N — Outcome-Near Condition / Operative Payload
  
  ```yaml
  label: N
  summary: >
    The policy package's operative payload included three main parts: privacy principles, a data management policy, and a facial-recognition-technology prohibition. The privacy principles covered equitable privacy practices, limiting collection and retention, diligent management, third-party data sharing, public-records privacy, transparency, and accountability. The data management policy addressed how the City stores, manages, and uses data collected through channels such as websites, application forms, paper or electronic forms, and phone messages, while excluding public-safety and investigative data covered by separate policies. The facial recognition policy prohibited City staff from obtaining, retaining, accessing, or using facial recognition technology or information obtained from it, with stated exceptions such as public-safety/criminal-investigation contexts involving outside-agency use and common device access uses. The Council's motion added direction for future ordinances.
  
  evidence:
    - "we do have a resolution with three attachments this evening ... exhibits A, B and C"
    - "there are seven privacy principles that have been assembled for your consideration"
    - "limit collection and retention of personal information"
    - "The third is managing personal information with diligence"
    - "extending privacy protections to our relationships with third parties"
    - "safeguarding individual privacy and public records disclosures"
    - "being transparent and open"
    - "accountable to Alameda residents"
    - "assembled a data management policy ... how we're storing, managing and using the data"
    - "the policy doesn't apply to data and information collected for public safety"
    - "no staff shall obtain, retain access or use facial recognition technology or that information that might be obtained from that kind of technology"
    - "there are a series of exceptions ... public safety and criminal investigations ... cell phones that have face recognition technology"
  
  source_vocabulary:
    - three attachments
    - exhibits A, B and C
    - seven privacy principles
    - equitable privacy practices
    - limit collection and retention
    - managing personal information with diligence
    - third parties
    - public records disclosures
    - transparent and open
    - accountable to Alameda residents
    - websites / application forms / paper or electronic forms / phone messages
    - public safety exception
    - criminal investigations
    - facial recognition technology
    - automated or semi-automated process
  
  temporal_status:
    primary: completed_in_session
    notes:
      - The policy package was approved in-session.
      - Its operating rules apply to ongoing/future city conduct.
      - Ordinance conversion or additional ordinance drafting remained pending future handling.
  
  source_context_for_fact_check:
    payload_carrier:
      - Council resolution / policy package with three attachments or topic areas
      - final Council motion approving the policies/principles and directing future ordinance work
    payload_content:
      privacy_principles:
        - design and use equitable privacy practices
        - limit collection and retention of personal information to justified purposes
        - manage personal information with diligence and keep security/management systems current
        - extend privacy protections to third-party relationships and disclose sharing unless law prevents it
        - safeguard individual privacy in public-records disclosures while complying with open-government law
        - be transparent and open about why data is collected and how information is used, including easy-to-understand language on websites and forms
        - be accountable to Alameda residents, including public conversation and review when surveillance technology is needed
      data_management_policy:
        - addresses storing, managing, and using data
        - gives examples of data collection channels such as websites, application forms, paper or electronic forms, and phone messages
        - excludes data and information collected for public safety, emergency response, and investigations; those are covered by separate policies
      facial_recognition_policy:
        - prohibits City staff from obtaining, retaining, accessing, or using facial recognition technology or information obtained from it
        - staff described exceptions involving public-safety/criminal-investigation contexts and ordinary device access such as cell-phone face recognition
        - staff clarified that Alameda would not itself take a face from an ATM video and submit it to a facial recognition system
        - staff/Police clarified body-worn camera footage did not use facial recognition matching or identification; face detection for redaction/framing was distinguished from matching
      future_direction:
        - staff to return with facial recognition ban ordinance
        - staff to return with data management / privacy oversight ordinance
        - staff to consider a surveillance ordinance and strongly consider San Francisco / ACLU-style models
    payload_scope:
      - City of Alameda staff and city operations
      - city-collected resident data and personal information
      - non-law-enforcement data management policy, with public-safety/investigation data excluded from that policy
      - not a direct limit on outside agencies' own systems or vehicles
    payload_scalar_or_baseline:
      - value: three
        meaning: number of policy attachments/topic areas in the staff report
      - value: seven
        meaning: number of privacy principles described in the staff presentation
  
  answer_locality: >
    Staff presentation on exhibits A, B, and C; clarifying questions on facial-recognition scope and public-safety exclusions; Council motion adding ordinance direction.
  
  marker_presence:
    status: explicit
    markers:
