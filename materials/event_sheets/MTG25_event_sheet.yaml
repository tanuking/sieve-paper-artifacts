  ## Slot L — Concrete Concern
  
  ```yaml
  label: L
  summary: >
    Speakers and Council members raised concrete concerns that facial recognition and surveillance technology could harm privacy, chill protest and public speech, enable tracking or profiling, misidentify people of color and women, expose Muslim communities and activists to surveillance, allow vendors to profit from resident data, and let government-collected data be misused or retained against residents. Staff also identified privacy and equity concerns from people being scanned without knowing it.
  
  evidence:
    - "there's growing concern regarding the privacy and equity because individuals who are having their face scanned may not even know that that's happening."
    - "Last thing I want is for somebody to have my profile wherever I go."
    - "The hardware is everywhere. We have cameras everywhere. We have plate readers everywhere. All we need is to switch on the software."
    - "It violates the First Amendment because it offers a very real possibility of chilling free speech."
    - "we want to make sure that this surveillance technology is not going to be misused against them"
    - "I don't want to just hold on to data to have it where it can be used against people."
    - "African-Americans are 5 to 10 times more likely to be misidentified."
  
