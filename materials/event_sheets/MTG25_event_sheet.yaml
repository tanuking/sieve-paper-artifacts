  ## Slot T — Topic / Framing
  
  ```yaml
  label: T
  summary: >
    The segment was framed around Alameda's privacy and data governance policies: establishing privacy principles, creating a data management policy for city-collected data, and restricting the City's use of face recognition technology. The policy direction was to protect residents' personal data, improve transparency and accountability, and prohibit City staff from obtaining, retaining, accessing, or using facial recognition technology or information obtained from it, subject to stated exceptions.
  
  evidence:
    - "Adoption of resolution establishing a privacy policy data management policy and prohibiting the use of face recognition technology."
    - "We are talking about about privacy, data management this evening."
    - "policies that are related to how this city manages our residents privacy and the data that's collected as part of our ongoing operations."
    - "state the city's commitment to maintaining and building trust ... protecting the integrity of the personal data and ensuring that there's transparency in how we collect the data and how it's used."
    - "no staff shall obtain, retain access or use facial recognition technology or that information that might be obtained from that kind of technology."
  
  source_vocabulary:
    - privacy policy
    - data management policy
    - personal data
    - residents' privacy
    - transparency
    - equitable privacy practices
    - face recognition technology
    - facial recognition ban
    - surveillance technology
    - accountability to Alameda residents
  
  temporal_status:
    primary: completed_in_session
    notes:
      - The policy package was discussed and approved during the segment.
      - The substantive policy effects concern ongoing and future city data practices and technology use.
      - Later ordinance drafting remained pending after the vote.
  
  source_context_for_fact_check:
    subject: Alameda privacy policy, data management policy, and face recognition technology restrictions.
    policy_direction:
      - establish privacy principles and data management policy
      - protect integrity of personal data and increase transparency about data collection and use
      - prohibit City staff from obtaining, retaining, accessing, or using facial recognition technology or information from such technology
      - later convert or supplement the policy framework through ordinances
    target:
      - City of Alameda handling of residents' privacy and city-collected data
      - City staff use of facial recognition technology
      - City processes for surveillance-technology acquisition and oversight, as discussed for future ordinance work
    scope_limits:
      - Staff said public-safety data and information collected for emergency response or investigations were covered by separate policies and were not part of the data-management policy being discussed.
      - Staff said the City itself would not seek out or initiate facial recognition use, but information generated by another agency in a criminal investigation could enter Alameda's investigative process.
      - The policy would not itself limit outside agencies operating their own systems.
  
  answer_locality: >
    Opening agenda statement, staff presentation on the three exhibits, clarifying questions about facial recognition scope, and final motion language.
  
  marker_presence:
    status: explicit
    markers:
      - agenda title names privacy policy, data management policy, and face recognition prohibition
      - staff presentation repeatedly uses "privacy," "data management," "personal data," "transparency," and "prohibition"
      - later Council discussion uses "ordinance," "surveillance ordinance," and "facial recognition ban"
  ```
  
