  label: S
  summary: >
    A recurring concern theme across the segment was that facial recognition, surveillance acquisition, and weak data-governance controls could undermine privacy, civil rights, public trust, and equal participation. The theme appeared in staff framing, multiple public comments, and Council deliberation, especially through repeated calls to move from policy to enforceable ordinance and to require transparency, accountability, and public oversight.
  
  evidence:
    - "privacy in California is a right, but only if you defend it."
    - "I'm here to speak in favor of an ordinance, not a policy, to ban the use of facial recognition technology and regulate the use the acquisition of new surveillance equipment on the island."
