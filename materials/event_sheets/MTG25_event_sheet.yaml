    - "Transparency in the acquisition of such surveillance technology ... accountability"
    - "I am beyond just having a policy. I would like it to be a hard and fast ordinance."
    - "I do think the folks who spoke today and many others like them deserve the protection of law and not just policy."
    - "I'm 100% supportive of moving this not as a policy, but as an ordinance"
  
