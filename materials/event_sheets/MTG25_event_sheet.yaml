  label: O
  summary: >
    The Alameda City Council approved the privacy principles and policies as written and also directed staff to return with ordinance work. The direction included a facial recognition ban ordinance, a data management / privacy oversight ordinance, and consideration of a surveillance ordinance using San Francisco / ACLU-style models as examples. The final motion passed unanimously.
  
  evidence:
    - "I move approval of the policies as written, but I would also move to direct staff to come back to us with facial recognition ban ordinance and with data manage management and privacy oversight ordinance."
    - "Would you with the motion maker and seconder, include adopting the principles tonight ... Policies which I will amend to include the principles."
    - "would you be willing to add the surveillance ... strongly consider using San Francisco as a model. Then then I'm fine with that."
    - "With that all in favor, I oppose, abstain and the motion passes unanimously."
  
