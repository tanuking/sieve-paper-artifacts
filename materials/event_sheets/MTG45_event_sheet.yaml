  ## Segment-level source note
  
  Docket 0246 concerned Councilor Murphy's order for a hearing on changes to the memorandum of agreement / work conditions created by Boston's COVID-19 vaccine mandate and related Be Together initiative discussion. The segment included councilor comments about collective bargaining, transparency, public health safety, testing, vaccination, possible employee terminations, and committee referral. The docket was referred during the segment, with committee-placement discussion continuing briefly before the meeting moved to Docket 0247.
  
