  ## Notes for downstream QA authoring
  
  - The transcript has several automatic-transcription artifacts, including likely misrenderings such as "MLA" for memorandum-of-agreement context and "DAWKINS 024 Sex" for Docket 0246. Treat the surrounding source context rather than the malformed token alone.
  - Do not treat the referral of Docket 0246 as a final vote on, repeal of, or adoption of the vaccine mandate. The source supports referral / hearing handling, not final policy disposition.
  - Do not treat the public-health comments as rejecting vaccination. Multiple speakers supported vaccination while also arguing for testing, bargaining, or transparency.
  - Scalar values are limited: the segment states 372 BTU members still unvaccinated as of Monday and references a two-year-old emergency declaration / six-to-seven months of prior daily meetings. No vote count on Docket 0246 is stated.
