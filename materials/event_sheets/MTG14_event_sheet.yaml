    - >-
      Jay Marine said DHS had built the ordinance to allow contracting with someone other than
      the Community Center Board, but the department did not consider immediately bidding it out
      because it saw efficiencies in one agency administering state, federal, and mill levy funds.
    - >-
      Jay Marine said the state legislature would need to act to bring Colorado statutes into
      conformance with the federal conflict-free case management rule, and that Joint Budget
      Committee options included timelines extending as far as 2022.
    - >-
      a councilwoman asked DHS to investigate best practices for ongoing city input from
      the customer base before future contract decisions.
    - >-
      Jay Marine said he would come back to committee in the next month or two to share how DHS
      would effectuate some type of public input into mill levy spending.
