  ## Slot T — Topic/Framing
  
  ```yaml
  label: T
  summary: >-
    The segment framed Council Bill 1071 as an ordinance to codify and revise Denver's
    administration of the 2003 Initiative 100 mill levy for services and supports for people
    with intellectual and developmental disabilities, including permitted uses of proceeds,
    administrative-cost limits, residency alignment, monitoring, Medicaid matching-fund use,
    and potential contracting beyond Rocky Mountain Human Services.
  
  evidence:
    - >-
      Staff described the bill as addressing a 2003 voter-initiated ordinance that established
      a mill dedicated to the community center board for people with intellectual and
      developmental disabilities.
    - >-
      Staff said the auditor's recommendations included codifying Initiative 100, determining
      questionable spending of mill levy funds, limiting administrative costs to 15%, addressing
      residency requirements, and monitoring the contract quarterly.
    - >-
      Staff described proposed ordinance elements: deposit proceeds in the Human Services
      Special Revenue Fund, define permitted uses, allow contracts for services and supports
      through the Community Center Board or another service entity, authorize transfers for
      Medicaid waiver matching funds, and set administrative-expense limits.
  
  source_vocabulary:
    - "Council Bill 1071 series of 2016"
    - "voter initiated ordinance from 2003"
    - "community center board for people with intellectual and developmental disabilities"
    - "mill levy funds"
    - "codify Initiative 100"
    - "questionable spending"
    - "administrative costs to 15%"
    - "residency requirements"
    - "monitor the contract on a quarterly basis"
    - "contract for services and supports"
    - "any other entity that provides such services"
    - "matching federal funds"
  
  temporal_status:
    primary: currently_existing
    secondary:
      - future_effect
      - completed_in_session
    notes:
      - >-
        The policy subject and administrative context already existed before the hearing.
      - >-
        The policy changes described in the ordinance would have future effect after passage.
      - >-
        The Council action on the bill was completed in this segment.
  
  source_context_for_fact_check:
    subject: >-
      Administration and codification of the 2003 Denver mill levy for services and supports
      for people with intellectual and developmental disabilities.
    policy_direction:
      - Codify Initiative 100 in city ordinance.
      - Define permitted uses of mill levy proceeds.
      - Limit administrative expenses to less than 15%.
      - Align residency requirements with state rules and requirements.
      - Provide for contract monitoring and accountability.
      - Permit contracting for services and supports through the Community Center Board or through other service-providing entities.
      - Permit transfer of funds to the Colorado Department of Health Care Policy and Financing for Medicaid waiver matching funds.
    target:
