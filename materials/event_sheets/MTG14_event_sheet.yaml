  ## Slot N — Outcome-Near Condition / Operative Payload
  
  ```yaml
  label: N
  summary: >-
    The operative payload of Council Bill 1071 included depositing mill levy proceeds in the
    Human Services Special Revenue Fund, defining permitted uses for services and supports,
    allowing contracting through the Community Center Board or other service-providing entities,
    authorizing transfer of funds to the Colorado Department of Health Care Policy and Financing
    for federal Medicaid waiver matching funds, setting administrative expenses below 15%,
    aligning residency requirements with state rules, and reserving no more than 0.75% of total
    collections for DHS administration and enforcement.
  
  evidence:
    - >-
      Staff said the proposed ordinance directs mill levy proceeds to the Human Services
      Special Revenue Fund and defines permitted uses, including contracts for services and
      supports through the Community Center Board or any other entity that provides such services.
    - >-
      Staff said the ordinance authorizes transfer of funds to the Colorado Department of
      Health Care Policy and Financing for matching federal funds to provide Medicaid-approved
      waiver services.
    - >-
      Staff said the ordinance sets an administrative-expenses limit to less than 15%.
    - >-
      Staff said residency requirements were aligned with state rules and requirements.
    - >-
      Staff said the ordinance includes a carve-out of mill levy revenues not to exceed 0.75%
      of total collections for DHS to administer and enforce, equating to about $114,000 annually
      under current mill levy revenues of roughly $14.5 million.
  
