  ## Slot L — Concrete Concern
  
  ```yaml
  label: L
  summary: >-
    Speakers and council members raised concrete concerns that mill levy money was being
    spent too heavily on case management, administration, or agency operating costs rather
    than direct supports; that Rocky Mountain Human Services' sole or dual role created
    conflicts and limited competition; that reporting and public input were insufficient;
    and that conflict-free case management had not yet been implemented.
  
  evidence:
    - >-
      Ann Peyton said she was concerned that about 56% of mill levy money across waivers was
      spent on case management over and above Medicaid-billed case management, and argued that
      mill levy dollars should go to programming rather than supplant billable operating expenses.
    - >-
      Don Caldwell said sole discretion over mill levy funds created conflict, said funds had
      been discussed as being withheld without public comment or vote, and criticized insufficient
      substantive reporting and alleged losses covered with mill levy funds.
    - >-
      Rob Hernandez described conflict-free case management as requiring separation between
      case management and direct services, and said the current arrangement created potential
      steering conflicts.
    - >-
      Maureen Welch argued that property taxes were supposed to benefit individuals directly,
      not fund a large agency, and called for more choice, reduced conflict of interest, and
      clearer administrative-overhead definition.
    - >-
      a councilwoman said the city lacked its own mechanism for ongoing input from the
      contractor's customer base and asked DHS to investigate best practices for such input.
  
  source_vocabulary:
    - "concern for me"
    - "56% across all waivers"
    - "over and above the case management amount"
    - "mill levy dollars should be going to programing"
    - "supplanting billable operating expenses"
    - "sole discretion creates conflict"
    - "no substantive data"
    - "conflict free case management"
    - "separate case management services from direct services"
    - "robust competition"
    - "more choice"
    - "administrative overhead"
    - "public input"
    - "customer experiences"
  
  temporal_status:
    primary: currently_existing
    secondary:
      - recurring_concern
      - hypothetical_or_risk
      - pending_future_handling
    notes:
      - The concerns were raised during public comment and council questioning as current or recurring issues.
      - Some conflict statements were framed as potential conflicts or risks rather than proven misconduct in this segment.
      - Some remedies, such as a city feedback mechanism and later contracting choices, remained pending.
  
  source_context_for_fact_check:
    obstacle_content:
      - Public-comment concern that mill levy funds were being used for case management or agency operating costs instead of direct programming/supports.
      - Public-comment concern that Rocky Mountain Human Services' sole or dual role created conflict-of-interest or steering risks.
      - Public-comment concern that reporting did not give enough substantive detail about how funds were used.
      - Public-comment and council concern that administrative overhead needed clearer definition and public input.
      - Council concern that the city needed its own mechanism to hear from the contractor's customer base before future contract decisions.
    local_anchor:
