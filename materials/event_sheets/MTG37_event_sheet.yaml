  ## N — Outcome-Near Condition / Operative Payload
  
  label: N — Outcome-Near Condition / Operative Payload
  
  summary: >
    The operative payload of the final council action was not merely to keep the vehicle. It also attached a policy condition: Alameda would use the Berkeley Police Department Policy 706 framework as the immediate policy baseline for the emergency response vehicle, while staff would return with a focused policy discussion, including possible active-shooter language, comparison with Alameda's existing policy, and opportunity for public and council input.
  
  evidence:
    - The mayor proposed retaining the vehicle while adopting an emergency response vehicle policy "similar to or identical to" Berkeley's policy.
    - Councilmember Herrera Spencer later shaped the motion to retain the vehicle and come back for policy review, with Berkeley policy as the starting point.
    - Councilmember Knox White asked to add direction for proposed language narrowing or focusing on active-shooter circumstances.
    - The interim police chief said staff had reviewed the Berkeley policy and was comfortable with it as Alameda's policy, except for location-specific storage references.
    - The final discussion confirmed that the policy would return so the public and council could consider other policies and language.
  
