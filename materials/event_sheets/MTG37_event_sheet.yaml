  ## B — Agenda-Setting Background / Precipitating Context
  
  label: B — Agenda-Setting Background / Precipitating Context
  
  summary: >
    The item came back because the Council had previously directed sale of the vehicle during June 2020 budget and police-reform discussions, but police staff believed the vehicle's safety rationale and use history had not been fully considered. Additional background included the vehicle's 2012 approval and 2013 delivery, its replacement of an older armored vehicle, its limited Alameda use, its frequent mutual-aid use, and public concern after national debates over militarized policing.
  
  evidence:
    - The mayor said the regular agenda item had been "continued twice."
    - The city manager explained that the sale direction arose as part of the budget motion after protests in early to mid-June 2020, when police budget reductions were under consideration.
    - Captain Emmett said he felt he owed it to APD employees to present the other side and explain why the equipment was important to APD and Alameda residents.
    - The chief described prior history: Council approved purchase in 2012, delivery occurred in 2013, and the vehicle replaced an older 1997 GMC armored vehicle.
    - Public commenters repeatedly referenced the June 2020 decision, use counts showing only a few Alameda deployments, mutual-aid use outside Alameda, racial justice, and militarized policing concerns.
  
  source_vocabulary:
