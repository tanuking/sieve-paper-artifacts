    - mutual aid
    - militarization
    - racial justice
  
  temporal_status:
    primary: already_occurred
    notes:
      - The prior sale direction, budget context, purchase approval, delivery, and past uses all occurred before this segment.
      - These background facts shaped why the item was before the Council and how the current proposal was discussed.
  
  source_context_for_fact_check:
