  ## O — Outcome/Position
  
  label: O — Outcome/Position
  
  summary: >
    The Alameda City Council completed an in-session disposition on the emergency response vehicle. A motion to simply reverse the prior June 2020 sale direction failed 2-3. A later motion carried 3-2 to retain the vehicle, adopt the Berkeley Police Department Policy 706 approach as the immediate policy baseline, and have staff return with further policy review and potential refinements.
  
  evidence:
    - Councilmember Daysog moved "that we reverse our decision of June [2020] regarding selling of the armored vehicle"; that motion failed 2-3.
    - The subsequent motion evolved to retain the vehicle, use Berkeley Police Department Policy 706 as the current policy basis, and return for later policy discussion.
    - The mayor stated the final vote "carries 3 to 2."
  
