  ## L — Concrete Concern
  
  label: L — Concrete Concern
  
  summary: >
    The discussion included concrete concerns on both sides. Retention supporters emphasized the risk that officers or civilians could face armed suspects, active shooters, terrorism, or mass-casualty violence without immediate armored rescue capability, and that borrowing a vehicle could create dangerous delay. Opponents and skeptical councilmembers emphasized the vehicle's intimidating and militarized appearance, racial-justice symbolism, possible use in protests or crowd control, low Alameda use, and the risk of overbroad police discretion.
  
  evidence:
    - The chief estimated that borrowing a vehicle from another city would take at least about 20 minutes under ideal circumstances and could take longer with availability, operators, and Bay Area traffic.
    - Speakers supporting retention described active-shooter or bleeding-victim rescue scenarios where timing could be life-or-death.
    - Public commenters opposing retention described the vehicle as a symbol of militarized policing and racial injustice, questioned its low Alameda use, and objected to its use or potential use in demonstrations or neighborhood deployments.
    - Councilmembers Knox White and Vella discussed the vehicle's intimidating appearance, possible deployment impacts, discretion, and the need to limit use outside active-shooter or truly violent circumstances.
  
  source_vocabulary:
    - 20 minutes
    - ideal circumstances
    - active shooter
    - officer or citizen shot and bleeding out
    - racial equity
    - racial justice
    - militarized policing
    - intimidation
    - crowd control
    - peaceful protest
    - discretion
    - low use
    - mutual aid
  
  temporal_status:
    primary: hypothetical_or_risk
    notes:
      - Armed-suspect, active-shooter, terrorism, and rescue scenarios were discussed as risk conditions.
      - Racial-justice, intimidation, protest-use, discretion, and symbolic-harm concerns were recurring concerns grounded in current and past policing debates.
      - Use-history concerns were based on already-occurred deployments.
  
  source_context_for_fact_check:
    obstacle_content:
      - Support-side concern: without a locally available armored vehicle, APD might face delay in rescuing civilians or officers or approaching armed-danger scenes.
      - Opposition-side concern: the vehicle could symbolize or contribute to militarized policing, racial inequity, intimidation, inappropriate protest/crowd-control presence, or excessive discretionary deployment.
      - Use-justification concern: the vehicle had been used only a few times in Alameda while often loaned through mutual aid, which opponents used to question local necessity.
    local_anchor:
