  ## Segment-level source note
  
  This segment concerns Alameda City Council's policy decision about the Alameda Police Department's emergency response vehicle. The discussion centered on whether the City should retain or sell the armored vehicle and, if retained, whether the Council should narrow or formalize the policy governing when it may be deployed. The eventual policy direction was to retain the vehicle as a safety and rescue tool while tightening the rules for its use.
  
  ## T — Topic/Framing
  
  label: T — Topic/Framing
  
  summary: >
    The segment framed a policy decision about Alameda Police Department's emergency response vehicle: whether the City Council should retain or sell the armored vehicle, and whether its deployment should be governed by a more explicit use policy. The policy direction pursued by staff and the eventual council majority was to retain the vehicle as a safety/rescue tool while narrowing or formalizing the policy governing when it may be deployed.
  
  evidence:
    - "Recommendation to consider options for the Alameda Police Department's emergency response vehicle."
    - The interim police chief described the vehicle as a "ballistic armored tactical transport vehicle" used to transport officers and tactical medics to scenes involving objective risk from armed suspects and to rescue civilians or employees from active-shooter, terrorism, or mass-casualty violence.
    - The chief urged the Council "to approve keeping the emergency response vehicle as a safety tool."
    - Council discussion centered on retaining the vehicle, selling it, adopting a Berkeley-style policy, and returning later with policy refinements.
  
