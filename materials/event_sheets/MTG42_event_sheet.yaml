    - public benefit features
    - signage requirement
    - reviewed and approved by street vacations
    - seek enforcement against Amazon
  temporal_status:
    primary: future_effect
    secondary:
      - completed_in_session
      - hypothetical_or_risk
    notes:
      - The amendment/petition vote was completed in session.
      - The conditions would govern future use and enforcement after the conditioned vacation/PDA took effect.
      - Enforcement would be triggered only if a claim arose that the free-speech condition had been violated.
  source_context_for_fact_check:
    payload_carrier:
      - amendment to Clerk File 314278
      - PDA / property use and development agreement condition
      - conditioned grant of the Block 21 alley vacation petition
    payload_content:
      - Publicly open and accessible areas must remain open and accessible 24 hours a day.
      - Temporary closures are allowed only for reasons such as maintenance, safety, or private functions.
      - Free-speech activities are allowed in public benefit features if they do not obstruct access and do not unreasonably interfere with others' enjoyment of the space.
      - Members of the public may not be asked to leave except for conduct that unreasonably interferes with others' enjoyment of the space.
