    vacation while adding public-access and free-speech protections to the privately owned
    public-space/public-benefit features associated with the project. The policy direction was
    to condition the vacation/PDA so that publicly accessible areas would remain open and usable
    for public activities, rather than approving the alley vacation without those protections.
