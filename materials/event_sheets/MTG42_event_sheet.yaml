  ## Slot N — Outcome-Near Condition / Operative Payload
  
  ```yaml
  label: N
  summary: >-
    The amendment's operative payload added conditions to the PDA/public-benefit features:
    public areas must be open 24 hours a day, temporary closures are limited to reasons such
    as maintenance, safety, or private functions, specified free-speech activities are allowed
    so long as they do not obstruct or unreasonably interfere with use, signage must inform
    users of those rights, and the city may seek enforcement against Amazon if the free-speech
    condition is allegedly violated.
  evidence:
    - "... the PDA, which is a property use and development agreement, will include a condition ..."
    - "... areas that are open and accessible to the public must be open and accessible for 24 hours a day, with temporary closures permitted only for reasons such as maintenance, safety or private functions ..."
    - "free speech activities include things like handling, signature gathering, holding signs, all without obstructing access to the space, the building or other adjacent amenity features, and without unreasonably interfering with the enjoyment of the space by others ..."
    - "Members of the public may not be asked to leave for any reason other than conduct that unreasonably interferes with the enjoyment of the space by others."
    - "Another aspect of this is that it creates both a signage requirement ... That sign will advise people ... with their rights around free speech activities."
    - "... a provision that will allow the city to seek enforcement against Amazon ... if there is a claim that the free speech condition has been violated ..."
  source_vocabulary:
