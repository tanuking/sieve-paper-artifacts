  ## Segment-level source note
  
  - The segment concerns Full Council agenda item 1, Clerk File 314278: a petition by ACORN Development LLC for vacation of the alley in Block 21, bounded by Bell Street, Seventh Avenue, Blanchard Street, and Eighth Avenue.
  - The transcript contains apparent ASR variants such as “allocation” and “allegation” where the surrounding context indicates the same alley vacation petition. This sheet treats those references as source vocabulary linked to Clerk File 314278.
  - Amazon is discussed as the project-related entity whose privately owned public-space/public-benefit features and security practices were central to the debate, even though the agenda item is introduced as ACORN Development LLC’s petition.
  
