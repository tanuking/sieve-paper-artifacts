  ## L — Concrete Concern
  
  ```yaml
  label: L — Concrete Concern
  summary: >
    Concrete concerns raised in the segment included the risk that RMD would reduce emergency medical service capacity or quality by replacing two-firefighter/paramedic ambulance staffing with a one firefighter-paramedic plus one EMT model, reducing transport-capable ambulances from 13 to 11, relying on budget savings rather than patient-care needs, lacking sufficient information about comparable fire-based systems, and creating reversion costs if the pilot failed.
  evidence:
    - Public speakers described personal emergency medical incidents and argued that two-paramedic/team care mattered for heart attack, seizure, respiratory failure, and transport situations.
    - Firefighter association speakers argued that RMD would replace sworn firefighters with non-sworn EMTs, reduce ambulances from 13 to 11, and leave insufficient ambulances for patient transport.
    - Councilmembers questioned whether fire-based public systems actually used the same model and whether the map conflated private and public-sector ambulance systems.
    - Councilmembers questioned electronic patient-care reporting, waived or changed County conditions, and whether the city had money to revert to the older model if the pilot failed.
    - Councilmembers also raised concerns about using or reprogramming one-time funds and about needing fuller FY15 budget discussion.
