  label: T — Topic/Framing
  summary: >
    The segment framed a substantive policy and operations question about whether Long Beach should proceed with or delay implementation of the Rapid Medic Deployment staffing model for Fire Department emergency medical response. The policy direction under discussion was to implement, continue toward, or delay a revised EMS staffing/deployment model that would place paramedics differently across fire engines, trucks, and ambulances while affecting Fire Department budget planning.
  evidence:
    - The item was introduced as a request for a status report on implementation of the Rapid Medic Deployment Staffing Model and the Fire Department FY14 budget, including whether to delay implementation until the FY15 budget process.
    - Staff said the RMD model had been discussed for a couple of years, was included in the FY14 budget, and had a delayed start.
    - The Fire Chief described RMD as a staffing model intended to put a paramedic on scene faster and convert existing 24-hour ambulances to ALS ambulances.
    - Council questions and public comments focused on whether the model should move forward, be delayed, or be reconsidered in the FY15 budget process.
