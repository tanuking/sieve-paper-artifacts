  label: N — Outcome-Near Condition / Operative Payload
  summary: >
    The operative terms discussed for the RMD implementation included a projected July 10, 2014 start, a County EMS pilot framework most recently discussed as a two-year term, conversion of all existing 24-hour ambulances to ALS units, staffing of 11 24-hour ambulances with one firefighter-paramedic and one EMT, placing a paramedic on every engine and one truck company, reducing transport-capable ambulances from 13 to 11 during peak-load comparison, expected average paramedic arrival improvement of about 1.5 minutes, and annual savings/cost avoidance of about $1.4 million relative to the current ambulance service.
  evidence:
    - Staff said the implementation start date suggested to the EMS Agency was July 10, 2014.
    - The Fire Chief said the pilot discussion had considered one-year and two-year terms, and the latest discussion used a two-year term.
    - The Chief said RMD would place a paramedic on scene 1.5 minutes faster on average citywide.
    - Staff said EMS accounted for nearly 84% of the Fire Department workload.
    - The Chief said the city had 17 fire engines, only nine of which currently had a paramedic on board.
    - The Chief said the program would convert all existing 24-hour ambulances to ALS ambulances and add resources to Stations 3, 12, and 22.
    - Finance said RMD would save about $1.4 million annually compared with current ambulance service.
