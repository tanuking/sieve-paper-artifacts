  ## Slot O — Outcome/Position
  
  label: `O`
  
  summary: >
    The Seattle City Council voted on the motion to grant the Occidental Avenue South street-vacation petition as conditioned. The final motion failed by a 4-5 vote, so the petition was not granted. Earlier in the segment, the Sustainability and Transportation Committee report had recommended granting the petition as conditioned with a divided report, but the full Council's final disposition was denial/failure of the motion.
  
  evidence:
    - Opening report: "The committee recommends the petition to be granted as condition, with a divided report with council members O'Brien, Johnson, Burgess and Harrell in favor and Councilmember Bagshaw opposed."
    - Before the final vote: "So I move to grant the petition as conditions..."
    - Final roll call: "Gonzalez. No. [Herbold], no. Johnson [aye]. Juarez no. O'Brien [aye]. Sawant no. Bagshaw? No. President Harrell. Aye."
    - Final disposition statement: "Four in favor. Five opposed. The motion fails and the petition is not granted."
  
