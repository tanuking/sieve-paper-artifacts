  ## Slot L — Concrete Concern
  
  label: `L`
  
  summary: >
    Councilmembers raised concrete concerns that the proposed street vacation and arena project could weaken Council leverage, proceed without a secured NBA team, worsen traffic and freight conditions, harm port/maritime/industrial jobs, inadequately consider Key Arena, and create broader land-use or public-benefit problems. These concerns were tied to SODO, the Port of Seattle, West Seattle/South Park access, downtown traffic corridors, and the working waterfront.
  
  evidence:
    - Bagshaw: "Without the assurance of an NBA team, without the improved transportation conditions, without addressing the impacts on the port, and without a serious look at the viability of Key Arena, we're losing our leverage."
    - Bagshaw: "The street vacation does not address the traffic problems that already impact our busses, our cars, our freight downtown..."
    - Bagshaw: "Why would we put family wage jobs at risk and compromise traffic and freight traffic... when there's no team..."
    - Juarez: "This decision weighs a nonexistent NBA franchise against Seattle's 160 year legacy as a maritime powerhouse..."
    - Sawant: "I cannot do that on the basis of undermining our working waterfront and good paying industrialized industrial, unionized industrial jobs."
