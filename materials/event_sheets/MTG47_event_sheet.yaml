  ## Slot N — Outcome-Near Condition / Operative Payload
  
  label: `N`
  
  summary: >
    The segment contains multiple operative payloads proposed or adopted as conditions/amendments to the street-vacation package. Passed condition amendments included event-scheduling restrictions, 24/7 access-road availability and easement, a South Massachusetts Street non-closure condition, pedestrian staircase/alternative mitigation, public-plaza events, 24-hour public plaza/restroom access with limited exceptions, and equity language for public art. Herbold's proposed condition preventing the street vacation from taking effect until Arena Co. obtained NBA franchise ownership rights failed. Because the final petition failed, these adopted amendments did not result in a granted street vacation in this segment.
  
  evidence:
    - Scheduling amendment: "No major event can be held at the arena between 4:00 and 7:00 on a weekday, with rare exceptions. No major event at the arena can overlap with major events at the other two facilities... [and] at least 3 hours between the end time of the first event and the scheduled start of the second..."
    - Access-road amendment: "This amendment makes certain that this access road be available basically 24 seven for access to CenturyLink Field, the CenturyLink Event Center, Safeco Field Sites. It also grants an easement..."
    - South Massachusetts Street amendment: "Massachusetts Street cannot be completely closed during construction of the proposed arena or during operation of the arena. If built..."
    - Failed NBA-trigger amendment: "The street cannot be closed to vehicles, pedestrians, bicycles until Arena CO ... has obtained ownership rights to an NBA franchise"; later, "So the amendment fails."
    - Staircase amendment: "Amendment two would require a staircase... for pedestrian improvements for increased pedestrian safety and connectivity between the arena in transit and parking"; later the ayes had it.
    - Public-events plaza amendment: "make the Plaza available for public events... up to 12 events... Implementation would be carried out in a final street vacation ordinance..."
    - Public access / arts amendment: "public plaza be accessible 24 hours a day... public restrooms ... open 24 hours... infuse equity for communities of color and tribal communities into the arts program..."
    - Final result: "Four in favor. Five opposed. The motion fails and the petition is not granted."
  
