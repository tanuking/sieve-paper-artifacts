  ## Segment-level note
  
  The sampled segment is a Seattle City Council discussion and vote on Agenda Item 3431295, a petition by WSC Properties / Arena Co. to vacate Occidental Avenue South for a proposed arena project. The segment includes: (1) a committee report recommending that the petition be granted as conditioned; (2) several condition/amendment votes; (3) extended debate over public benefit, NBA-team uncertainty, traffic, port/maritime impacts, labor, and Key Arena; and (4) a final Council vote on granting the petition as conditioned. The final motion failed, 4 in favor and 5 opposed, and the petition was not granted.
  
