  # event_sheet_11.md
  
  ## Segment
  
  Denver City Council public hearing and final consideration of Council Bill 1034, a map amendment rezoning application for 1209 Perry Street.
  
  ---
  
  ## T — Topic/Framing
  
  **label:** T — Topic/Framing
  
  **summary:**  
  The segment concerned a rezoning of the vacant property at 1209 Perry Street in the West Colfax neighborhood from existing lower-scale residential zoning to a General Urban Residential Mixed Use five-story district, in order to prepare the site for redevelopment near transit.
  
  **evidence:**  
  - Staff described the item as “a map amendment rezoning application for 1209 north of Perry Street.”  
  - The request was to rezone from “general urban multi-unit three stories and urban edge two unit” to “general urban residential mixed use five stories.”  
  - Staff said the property owner requested the rezoning “to prepare the property for redevelopment.”
  
  **source_vocabulary:**  
  - “map amendment rezoning application”  
  - “1209 Perry Street”  
  - “general urban multi-unit three stories”  
  - “urban edge two unit”  
  - “general urban residential mixed use five stories”  
  - “prepare the property for redevelopment”  
  - “West Colfax neighborhood”  
  - “Perry Street Station”  
  - “Lakewood Dry Gulch Park”
  
  **temporal_status:**  
  ```yaml
  primary: future_effect
  notes:
    - The rezoning decision occurred in-session.
    - The redevelopment enabled by the new zoning was future-facing.
    - The property was currently vacant at the time of the hearing.
  ```
  
