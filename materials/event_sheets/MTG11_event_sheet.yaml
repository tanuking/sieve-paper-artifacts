  ## L — Concrete Concern
  
  **label:** L — Concrete Concern
  
  **summary:**  
  A public speaker supported the rezoning but raised concrete concerns that it could affect Villa Park and the West Side, contribute to gentrification, divide the community, and fail to serve existing community needs, including a long-standing Jewish community and children using the area for school and transit access.
  
  **evidence:**  
  - David Roybal said he wanted to be cautious if this was the first rezoning pushing into the West Side and affecting Villa Park.  
  - He referenced long battles over property along the light rail, children using the area for school access, the Jewish community, and said he hoped the project would strengthen the community and “not bring any gentrification and divide the west side.”
  
