  ## S — Shared Concern Synthesis
  
  **label:** S — Shared Concern Synthesis
  
  **summary:**  
  The recurring concern theme was how transit-oriented redevelopment and increased density near Perry Street Station should avoid harming or displacing the existing West Side / Villa Park community and should remain responsive to local needs.
  
  **evidence:**  
  - David Roybal raised concern about gentrification, West Side division, Villa Park impact, school/transit access, and outreach to the Jewish community.  
  - Councilman Espinosa later referred back to what Mr. Roybal was saying and hoped the applicant would see whether there was any community need, while noting the zoning could still become 100% residential.
  
  **source_vocabulary:**  
