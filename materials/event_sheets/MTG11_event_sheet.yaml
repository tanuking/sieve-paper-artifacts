  ## N — Outcome-Near Condition / Operative Payload
  
  **label:** N — Outcome-Near Condition / Operative Payload
  
  **summary:**  
  The operative payload of the approved rezoning was to change the property’s zoning to GR-X-5, a five-story residential mixed-use district with specific use and building-form implications, including ground-story retail permission, upper-story lodging or residential use, and shopfront building form.
  
  **evidence:**  
  - Staff described the requested zoning change to “general urban residential mixed use five stories.”  
  - Staff explained that in the residential mixed-use district, ground-story retail is allowed, upper stories are limited to lodging or residential uses, strictly commercial buildings over 10,000 square feet are not allowed, and the shopfront building form is the allowed form.
  
