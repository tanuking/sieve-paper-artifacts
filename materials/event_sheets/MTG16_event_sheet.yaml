  ## T — Topic/Framing
  
  label: T
  
  summary: >
    The segment framed Proposed Ordinance 2022-0180 / transcript-rendered “2020 20180/201801”
    as a proposed King County Charter amendment that would move elections for the County Executive,
    County Assessor, County Director of Elections, and County Council members from odd-numbered
    years to even-numbered years, aligning those county offices with federal and state election years
    if voters later ratified the charter amendment.
  
  evidence:
    - >
      The chair introduced the item as a proposed ordinance to amend the King County Charter
      “to move elections for state and county offices from odd numbers to even numbered years,”
      and said passage would send it to county voters for ratification or rejection at the
      November 8, 2022 general election.
    - >
      Central Staff described the item as placing a charter amendment on the November 2022 ballot
      to move elections for County Executive, County Assessor, County Director of Elections,
      and County Council members from odd-numbered to even-numbered years.
    - >
      Staff later framed one policy consideration as whether the Council wanted to align these
      county-office elections with federal and state elections held in even-numbered years.
  
