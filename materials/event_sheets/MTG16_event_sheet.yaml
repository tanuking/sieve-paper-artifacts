  ## S — Shared Concern Synthesis
  
  label: S
  
  summary: >
    A recurring concern theme was that odd-year county elections may produce lower and less representative voter participation,
    while moving county races to even years might improve access and representation but still raised questions about ballot position,
    voter drop-off, and whether comparable turnout data could validate the expected effect.
  
  evidence:
    - >
      Staff reported that since 2010 King County’s average general-election turnout was about 77% in even-numbered years
      and 47% in odd-numbered years.
    - >
      Director Wise described even-year turnout as often reaching 70–80%, while some South King County jurisdictions in odd-year
      elections saw turnout around 30%.
    - >
      Councilmember Balducci framed the proposal as making elections fair and accessible and said odd-year voters tend to be
      older, whiter, and wealthier than the general electorate, while even-year alignment could bring in younger voters,
      more people of color, and more renters.
    - >
      Multiple members asked about whether the higher even-year electorate would actually carry through to down-ballot county races,
      including questions about ballot drop-off and examples from other jurisdictions.
  
  source_vocabulary:
    - “low voter turnout”
    - “higher voter turnout in even numbered years”
    - “fair and accessible”
    - “representative ... sample of the public”
    - “older, whiter and wealthier”
    - “younger people, more people of color, more renters”
    - “ballot drop off”
    - “higher percentage turnout”
    - “valid comparisons”
  
  temporal_status:
    primary: recurring_concern
    secondary:
      - currently_existing
      - hypothetical_or_risk
    notes:
      - Low and less representative odd-year participation was treated as an existing and recurring concern.
      - The precise turnout effect of moving the races was discussed as uncertain or requiring additional evidence.
  
  source_context_for_fact_check:
    concern_theme: >
      Low and potentially less representative participation in odd-year county elections, and uncertainty about whether moving county races to even years would solve that problem without down-ballot effects.
    concern_content:
