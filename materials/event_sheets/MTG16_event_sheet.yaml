  ## B — Agenda-Setting Background / Precipitating Context
  
  label: B
  
  summary: >
    The item was shaped by King County’s existing odd-year charter election schedule for several county offices,
    the state-law default that county offices are generally elected in even-numbered years unless a home-rule charter
    provides otherwise, and an access-to-elections rationale brought forward by community advocates.
    Staff and sponsor remarks also treated lower odd-year turnout and representativeness concerns as background for
    considering the charter amendment.
  
  evidence:
    - >
      Staff explained that every November the state holds a statewide general election; by default county officer elections
      are held in even years, except where a charter county provides for odd-year elections.
    - >
      Staff stated that King County’s elections for executive, assessor, director of elections, and councilmembers
      are outlined in Article VI of the King County Charter and are currently held in odd years.
    - >
      Director Wise said that, under RCW, county offices are up for election in even-numbered years unless a home-rule county
      decides otherwise, and identified King, Snohomish, and Whatcom as home-rule counties holding county-official elections
      in odd years.
    - >
      Councilmember Balducci said the proposal came from community advocates seeking to improve access to elections,
      and connected it to prior Council efforts such as ballot boxes and prepaid ballot postage.
  
  source_vocabulary:
    - “by default, county officer elections are held in even years”
    - “exception for counties governed by a charter”
    - “Article six of the King County Charter”
    - “currently elected in odd years”
    - “proposal came to me from some advocates”
    - “improve access to elections”
    - “fair and accessible”
  
  temporal_status:
    primary: currently_existing
    secondary:
      - already_occurred
      - recurring_concern
    notes:
      - The existing odd-year schedule was the current background condition.
      - Prior access-to-election efforts and advocate involvement were already-occurring background for the item.
      - Low-turnout and representativeness concerns recurred as policy background.
  
  source_context_for_fact_check:
    trigger_condition:
      - King County currently elects the executive, assessor, elections director, and councilmembers in odd-numbered years under its charter.
      - State law was described as defaulting county-office elections to even-numbered years unless a home-rule charter provides otherwise.
      - Community advocates brought the proposal forward as an elections-access measure.
      - Staff reported materially higher average King County general-election turnout in even-numbered years than odd-numbered years.
    agenda_connection:
      - These conditions and access concerns formed the stated context for discussing whether to place a charter amendment before voters.
    temporal_status:
      - Existing charter election schedule: currently_existing.
      - Prior advocacy and prior Council access measures: already_occurred.
      - Turnout/access concerns: recurring_concern.
  
  answer_locality: >
