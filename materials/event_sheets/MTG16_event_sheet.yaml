  ## N — Outcome-Near Condition / Operative Payload
  
  label: N
  
  summary: >
    The proposed ordinance’s operative payload was to place a charter amendment on the November 8, 2022 ballot;
    if approved by voters, the amendment would shift specified King County offices to even-year elections by making
    the next affected terms three-year transition terms and then returning later terms to four years.
    The proposal also repealed charter sections that would no longer apply.
  
  evidence:
    - >
      The chair said passing the ordinance would send the charter amendment to voters for ratification or rejection
      at the November 8, 2022 general election.
    - >
      Staff said the next term for the executive and Council districts 1, 3, 5, 7, and 9 would change only once
      to a three-year term from 2025 to 2028, then return to four-year terms.
    - >
      Staff said the next term for the assessor, elections director, and Council districts 2, 4, 6, and 8 would change
      to a three-year term from 2023 to 2026, then return to four-year terms.
    - >
      Staff said subsequent terms starting in either 2026 or 2028 would again be four-year terms,
      and that the proposed ordinance also repealed sections that would no longer apply.
  
  source_vocabulary:
