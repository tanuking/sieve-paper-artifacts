  ## L — Concrete Concern
  
  label: L
  
  summary: >
    Participants raised concrete concerns and tradeoffs about the proposal, including possible two-page ballots,
    shifted election-cost allocations among the county, state, and local jurisdictions, down-ballot drop-off if county races
    move below federal and state races, higher campaign costs without county public financing, and uncertainty about
    comparable data showing how turnout would change after such a shift.
  
  evidence:
    - >
      Staff said a potential operational cost could arise if moving county elections to even years resulted in two-page ballots,
      which would increase printing, storage, space, and staff sorting costs, although data did not show the move would necessarily
      result in two-page ballots.
    - >
      Staff and Elections Department witnesses explained that election costs are divided proportionally across jurisdictions
      appearing on a ballot, so moving county races could shift costs among King County, the state, and local jurisdictions.
    - >
      A City of Kent example was given: if King County had not appeared on the 2015 primary ballot, Kent’s election cost would
      have gone from about $43,000 to about $62,000.
    - >
      Councilmember Dembowski raised concern about ballot drop-off because county races would appear after federal and state races,
      and asked for analysis of drop-off in other counties.
    - >
      Councilmember Dembowski also raised concern that reaching more voters could increase campaign costs and create a barrier,
      especially without public financing and with incumbent fundraising advantages.
    - >
      Councilmembers Perry and Zahilay asked for clearer data or examples showing whether moving local elections to even years
      produced higher turnout; Elections staff said comparable examples were difficult to identify and that they would look further.
  
  source_vocabulary:
    - “two page ballots”
    - “additional costs for printing, storage, space and staff time”
    - “cost shifting”
    - “divided proportionally”
    - “ballot drop off”
    - “no longer have public financing”
    - “barrier”
    - “difficult to predict”
    - “valid comparisons”
    - “more data sleuthing”
  
  temporal_status:
    primary: hypothetical_or_risk
    secondary:
      - currently_existing
      - pending_future_handling
    notes:
      - Two-page ballots, cost shifts, turnout effects, and campaign-cost impacts were discussed as possible or analytical concerns.
      - The absence of public financing was described as a currently existing condition.
      - Additional analysis remained pending.
  
  source_context_for_fact_check:
    obstacle_content:
      - Potential two-page ballots could increase printing, storage, space, and sorting costs, but staff did not say two-page ballots were certain.
      - Election-cost allocation could shift among King County, the state, and local jurisdictions depending on which jurisdictions appear on a ballot.
      - Local jurisdictions could pay more in some odd-year elections if county races were removed from those ballots.
      - King County could pay more in some even-year elections if county races were added where the county otherwise would not have appeared.
      - County races would appear after federal and state races, raising a ballot drop-off concern.
      - Campaigns might face higher costs to reach more voters, and the county no longer had public financing.
      - Elections staff did not identify clear, directly comparable data proving the turnout effect of such shifts, though they mentioned looking further, including possible California data.
    local_anchor:
      - King County
      - local jurisdictions
      - City of Kent example for 2015 primary cost allocation
      - South King County jurisdictions as an example of low odd-year turnout mentioned by Director Wise
    temporal_status:
      - hypothetical_or_risk for possible operational, cost, ballot-order, campaign-cost, and turnout-data concerns
      - currently_existing for the lack of public financing
      - pending_future_handling for requested follow-up analysis
  
  answer_locality: >
    Staff cost and policy-considerations sections; Councilmember questions to Elections staff; Elections staff responses on cost allocation, ballot order, turnout prediction, and comparable data.
  
