  ## Segment-level source note
  
  The sampled segment concerns Denver City Council's reading, discussion, adoption, and ceremonial presentation of Proclamation 22-0218 honoring Larry Ambrose for his contributions to Denver neighborhoods, arts, civic engagement, planning, parks, historic preservation, and community service. The proclamation declares February 14, 2022, to be Larry Ambrose Day and honors his memory. Council adopted the proclamation by a 13-aye vote, after which Jane Parker Ambrose accepted the proclamation and Tim Sandoz offered remarks on Ambrose's service to the Southwest Improvement Council.
  
  ## Event-level synopsis
  
  The sampled segment concerns Denver City Council's reading, discussion, adoption, and ceremonial presentation of Proclamation 22-0218 honoring Larry Ambrose for his contributions to Denver neighborhoods, arts, civic engagement, planning, parks, historic preservation, and community service. The proclamation declares February 14, 2022, to be Larry Ambrose Day and honors his memory. Council adopted the proclamation by a 13-aye vote, after which Jane Parker Ambrose accepted the proclamation and Tim Sandoz offered remarks on Ambrose's service to the Southwest Improvement Council.
  
