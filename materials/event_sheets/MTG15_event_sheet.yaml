  ## Segment-level orientation
  
  The segment concerns a City Council call for review of a Planning Board decision denying a use permit that would allow beer and wine sales for off-premises consumption at a Circle K / 76 gas-station convenience store at 1716 Webster Street. Staff explained the use-permit framework, prior history, and neighborhood-health-and-safety findings. Public speakers and council members debated business fairness, changed conditions, competition, neighborhood impacts, overconcentration, loitering, drunkenness, drinking and driving, and possible permit conditions. Both a motion to uphold the Planning Board decision and a motion to approve the permit failed; because the Council took no action changing the Planning Board decision, the Planning Board denial stood.
  
