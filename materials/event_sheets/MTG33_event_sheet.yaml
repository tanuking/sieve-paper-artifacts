    - "special tax"
    - "parcel tax"
    - "utility users tax"
    - "transaction and use tax"
    - "business license tax"
    - "oil barrel tax"
    - "oil severance tax"
    - "transient occupancy tax"
    - "parking tax"
    - "real property transfer tax"
    - "admissions tax"
