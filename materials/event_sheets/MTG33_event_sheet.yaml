      - >
        Discussion of impacts on shopping, tourism, oil production, special events,
        regressivity, and business burden was hypothetical/risk-oriented.
  source_context_for_fact_check:
    payload_carrier: >
      Financial Management report/presentation that Council received and filed.
      The payload was informational and option-setting, not an adopted measure.
    payload_content:
      - General taxes may be used for general purposes and go to the General Fund.
      - Special taxes are for a specified purpose detailed in the ballot measure.
      - Parcel tax is based on a fee per parcel and always requires a two-thirds electorate vote.
