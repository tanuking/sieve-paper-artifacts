  ## Segment-level note
  
  This segment is a Long Beach City Council discussion of Item 3: a Financial Management report and presentation on infrastructure needs and possible revenue-measure options. The Council did **not** adopt a tax, place a ballot measure on the ballot, or direct preparation of a specific measure in this segment. The completed in-session action was to receive and file the staff report.
  
