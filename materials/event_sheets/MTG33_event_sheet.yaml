  label: N — Outcome-Near Condition / Operative Payload
  summary: >
    The source-supported payload is the informational content of the Financial
    Management report and presentation: a menu of possible revenue measures and
    financing mechanisms, their approximate revenue ranges, applicable vote thresholds,
    implementation considerations, and election-timing deadlines. This payload was
    attached to the received-and-filed report; it was not adopted as an operative tax
    or ballot measure during the segment.
  evidence:
    - >
      Staff distinguished general taxes from special taxes and explained that voting
      requirements differ depending on the type of tax and election timing, with
      special rules for transaction and use taxes and parcel taxes.
    - >
      Staff presented options including parcel tax, utility users tax changes or
      expansion, local sales and use / transaction and use tax, business license tax,
      oil barrel or severance taxes, transient occupancy tax, parking tax, real
      property transfer tax, admissions tax, general obligation bonds, community
      facilities districts, assessment districts, and lease revenue bonds.
    - >
      Staff gave illustrative values such as a $50 residential parcel fee producing
      about $13.8 million per year under one scenario, each 1% UUT increase producing
      about $7.7 million, a transaction and use tax of up to 1% producing up to about
      $48 million per year, a $50 business-license-account increase producing about
      $1.5 million, and each 1% transient occupancy tax increase producing about
      $1.4 million to the General Fund.
    - >
      Staff explained possible next steps: if Council wished to proceed with a ballot
      measure, it would need to decide measure type and tax amount, develop ballot
      language, and determine timing, with June 7, 2016 and November 8, 2016 timing
      discussed and filing/adoption deadlines identified.
  source_vocabulary:
