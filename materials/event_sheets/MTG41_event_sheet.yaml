  ## Segment-level overview
  
  The segment covers Seattle City Council agenda items on the 2017–2018 budget package and related budget documents. The Council first placed Clerk File 314362 on file, then considered Council Bill 118849 adopting the budget, capital improvement program, and position modifications, and Resolution 31719 endorsing the 2018 budget and position modifications. Councilmembers used the discussion period to describe budget priorities, concerns, and implementation themes before the Council passed the budget bill 8–1 and adopted the resolution.
  
