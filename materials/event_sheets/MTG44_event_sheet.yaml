  ## Segment-level source note
  
  This sampled segment covers Seattle City Council agenda items 35 and 36, the major 2021 budget actions following the Select Budget Committee process. The substantive subject is the City of Seattle's 2021 budget and 2021-2026 capital improvement program. The policy direction discussed by members is an amended budget package intended to fund COVID relief and equitable recovery, housing and homelessness responses, community-safety alternatives and police-budget changes, transportation and climate investments, and other city services.
  
