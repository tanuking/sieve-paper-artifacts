      - pending_future_handling
    notes:
      - The payload describes what the ordinance would require after its effective date.
      - The council acted on the item during the session.
      - Final ordinance handling/final reading remained future-facing.
  
  source_context_for_fact_check:
    payload_carrier:
      - Ordinance amending Title 6 of the Long Beach Municipal Code.
      - Item 17 as moved with a friendly amendment.
    payload_content:
      dog_spay_neuter:
        - All non-exempt dogs must be spayed or neutered by six months of age.
        - Effective date proposed as October 1, 2015.
        - Cats already had mandatory spay/neuter at four months of age since 2010.
      exemptions:
        - Medical exemption, permanent or temporary, certified by a veterinarian.
        - Animals incapable of breeding or not suited for surgery because surgery would likely cause death or aggravate conditions.
        - Law enforcement, search-and-rescue, or service animals, including animals bred for those purposes.
        - Certified show dogs and competition or herding dogs, or breeding stock for those purposes.
        - Show-dog exemption did not require active show participation, according to staff.
      pet_shop_restrictions:
        - Pet shops/animal shops may not sell, barter, give away, or transfer dogs, cats, or rabbits except through specified source categories.
        - Allowed source categories included animals bred and reared within the city in compliance with the breeding ordinance, public animal shelters, private humane societies, or rescue/adoption organizations.
        - A certificate of source would be required for each animal displayed or sold at a pet shop.
        - Effective date also described as October 1, 2015.
      implementation_and_enforcement:
        - $5,000 for education/public outreach.
        - $30,000 increase to the spay/neuter voucher program.
        - One part-time license inspector.
        - Enforcement focus was education, warnings, vouchers, and low-cost opportunities rather than citations.
        - Citations existed as a fallback.
      fees_and_cost_recovery:
        - Estimated lost revenue from unaltered vs altered license fees was about $187,000 / $187,500 annually.
        - Implementation costs were described as about $56,000.
        - Potential recovery included increasing altered license fee from $20 to $28.
        - Senior discounted altered license fee would increase from $10 to $14.
        - Unaltered license fee would increase from $95 to $105 for exempt owners.
      friendly_amendment:
        - Existing owners with an unaltered dog registered before October 1, 2015 could maintain that status if they kept the license current.
        - New dogs, dogs licensed after the date, dogs whose license lapsed, or additional animals brought into the home would not receive that grandfathered unaltered option.
    payload_scope:
      - City of Long Beach.
      - Dog owners and dogs subject to the spay/neuter requirement.
      - Pet shops, animal shops, retail businesses, and other commercial establishments dealing in dogs, cats, or rabbits.
      - Existing currently licensed unaltered dogs were treated differently under the friendly amendment.
