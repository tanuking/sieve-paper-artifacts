  ## Slot L — Concrete Concern
  
  ```yaml
  label: L
  slot_name: Concrete Concern
  
  summary: >
    Participants raised concrete concerns on both sides: supporters emphasized pet
    overpopulation, euthanasia, loose or abandoned intact animals, backyard breeding,
    and shelter burden; opponents and skeptical councilmembers emphasized budget loss,
    enforceability, low-income burden, owner noncompliance, vaccination/licensing
    avoidance, animal-health effects of early spay/neuter, and possible impacts on
    dog events or responsible owners.
  
  evidence:
    - "This will help with pet overpopulation. It's not a panacea, a cure all, but it is another tool..."
    - "The number of animals ... total. Was 4054."
    - "We're not going to adopt our way out of this problem."
    - "I regularly find non spayed, non neutered ... dogs on the street."
    - "Taking this hit of $187,500 annually, if not more, would be a significant hit to the city."
    - "Anytime we say mandatory, it becomes very, very intrusive..."
    - "I think this policy ... increases the burden on low income and communities that are not so advantaged."
    - "This decrease in licensing becomes a problem when animal owners choose to avoid seeing their veterinarians for rabies vaccines..."
    - "There are consequences. There are long term health consequences..."
    - "If you want to hold a dog show or a cat show or some type of trial here. You're putting your animal in danger by bringing it here..."
  
  source_vocabulary:
    - pet overpopulation
    - euthanasia
    - unwanted animals
    - backyard breeders
    - loose dogs
    - low income
    - burden
    - loss of revenue
    - enforcement
    - compliance
    - going underground
    - rabies vaccines
    - long term health consequences
    - growth plates
    - dog show
    - responsible pet owners
  
  temporal_status:
