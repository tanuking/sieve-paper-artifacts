  ## Slot N — Outcome-Near Condition / Operative Payload
  
  ```yaml
  label: N
  slot_name: Outcome-Near Condition / Operative Payload
  
  summary: >
    The ordinance payload included an October 1, 2015 effective date; a requirement
    that non-exempt dogs be spayed or neutered by six months of age; exemptions for
    medical, service/law-enforcement/search-and-rescue, show, competition, herding,
    and breeding-stock contexts; restrictions on pet-shop transfer of dogs, cats, and
    rabbits unless sourced through permitted city breeding, public shelters, humane
    societies, or rescue organizations; a certificate-of-source requirement; education,
    voucher, fee, and enforcement implementation measures; and a friendly amendment
    grandfathering currently licensed unaltered dogs if the license was kept current.
  
  evidence:
    - "What we're proposing is for a mandatory spay neuter ordinance to become effective on October 1st, 2015."
    - "All dogs must be spayed or neutered by six months of age unless exempted."
    - "One of the biggest exemptions is the medical exemption, and this can be permanent or temporary."
    - "We also have exemptions for law enforcement, search and rescue or service animals..."
    - "We also have an exemption for certified show dogs and competition or herding dogs or breeding stock..."
    - "We're proposing some additional moneys, $5,000 to help with our education, public education outreach."
    - "We're looking to increase our spay neuter voucher program by $30,000."
    - "We're looking to add one part time license inspector..."
    - "Our enforcement is really geared towards education and warnings and providing vouchers and low cost opportunities rather than citations."
    - "No person or animal shop shall engage in the sale, barter, giving away or transferring of dogs, cats or rabbits unless..."
    - "We will require a certificate of source for each animal that is displayed or sold at a pet shop."
    - "Anyone who is registering their animal ... prior to October 1st of 2015 and then maintains their license current would be able to maintain that animal."
  
