  label: O — Outcome/Position
  summary: >
    The Transportation Committee reported a divided recommendation that the full Council
    grant the alley-vacation petition with conditions. During the full Council segment,
    a motion to refer item 53 back to the Transportation Committee failed on a 4-4 vote.
    A proposed amendment adding free-speech/public-access language was not considered
    because the required two-thirds vote to suspend the rules was not achieved. The Council
    ultimately held item 53 to return to full Council on Monday, January 11, rather than
    granting final approval in this segment.
  evidence:
