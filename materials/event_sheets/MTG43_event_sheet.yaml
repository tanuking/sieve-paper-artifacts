  ```yaml
  label: L — Concrete Concern
  summary: >
    Several Councilmembers raised concrete concerns about privately owned public-benefit
    spaces replacing public right-of-way without clear, enforceable free-speech protections,
    including risks that private security could restrict signs, leafleting, worker speech,
    or protest activity. Other Councilmembers raised a competing concrete concern that
    delaying or changing conditions late in the process could be unfair to an applicant
    that had followed existing city vacation rules.
  evidence:
    - "My opposition ... was based on ... my concern that we are having more and more
       ... privately owned public spaces in our downtown area."
    - "The concerns were raised on how much access was denied to this area for expression
       of public speech..."
